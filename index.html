<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body><title>Brecha Cero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: one fixed game stage, never a scrolling page. HUD hugs the top corners, each of the 12 games owns the middle, answers sit in the thumb zone. Blue is your defense, orange is the threat. */
:root{
  --bg:#eceff4;
  --bg-2:#e1e5ed;
  --ink:#101a30;
  --mute:#566079;
  --line:#c6ccda;
  --safe:#2246de;
  --threat:#c03c0b;
  --on-safe:#ffffff;
  --redact:#101a30;
  --gold:#835c00;
  --hype:#c40c58;
  --on-hype:#ffffff;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --out:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b0a24;--bg-2:#18164a;--ink:#f4f3ff;--mute:#a4a2d6;--line:#2f2c6e;--safe:#00e0ff;--threat:#ff4d6d;--on-safe:#0b0a24;--redact:#2f2c6e;--gold:#ffd23f;--hype:#ff36d9;--on-hype:#0b0a24;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0b0a24;--bg-2:#18164a;--ink:#f4f3ff;--mute:#a4a2d6;--line:#2f2c6e;--safe:#00e0ff;--threat:#ff4d6d;--on-safe:#0b0a24;--redact:#2f2c6e;--gold:#ffd23f;--hype:#ff36d9;--on-hype:#0b0a24;color-scheme:dark}

html{height:100%;box-sizing:border-box;touch-action:manipulation}
*{touch-action:manipulation}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--safe);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.k{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#app{position:relative;height:100%;overflow:hidden;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.screen{position:relative;flex:1;min-height:0;width:100%;max-width:980px;margin-inline:auto;display:flex;flex-direction:column;animation:enter .45s var(--out) both}
@keyframes enter{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}

/* shared controls */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.bar-r{display:flex;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.02em;text-transform:uppercase;padding:8px 0}
.help-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
#s-title{position:relative}
.t-help{position:absolute;top:0;right:0;z-index:2}
.faq-box{width:min(560px,100%);max-height:100%}
.sk-box{width:min(440px,100%);max-height:100%;overflow:auto}
.sk-big{display:flex;align-items:center;gap:12px;color:var(--threat)}
.sk-big.cold{color:var(--mute)}
.sk-big .flame{width:40px;height:40px;flex:none}
.sk-big b{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1;color:var(--ink);text-transform:uppercase;letter-spacing:-.02em}
.sk-week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-self:stretch}
.sk-week i{height:10px;border-radius:5px;background:var(--line)}
.sk-week i.on{background:var(--threat)}
.sk-note{margin:0;color:var(--mute)}
.sk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;align-self:stretch}
.sk-stats div{padding:10px;border-radius:6px;background:var(--bg-2)}
.sk-stats dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.sk-stats dd{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:22px}
.faq{align-self:stretch;min-height:0;overflow:auto;display:flex;flex-direction:column}
.faq details{border-bottom:1.5px solid var(--line)}
.faq summary{padding:12px 4px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq-hi{margin:2px 0 12px;color:var(--mute);font-size:15px}
.faq-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-bottom:4px}
.faq-tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:96px;padding:14px;border:0;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,var(--bg-2));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 40%,transparent);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform .15s var(--out),box-shadow .15s}
.faq-tile:focus-visible{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--c),0 8px 22px -10px var(--c)}@media (hover:hover){.faq-tile:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 2px var(--c),0 8px 22px -10px var(--c)}}
.ft-e{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.ft-e.big{width:56px;height:56px;border-radius:14px;flex:none}
.ft-svg{width:24px;height:24px;fill:none;stroke:var(--c);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--c) 60%,transparent))}
.ft-e.big .ft-svg{width:32px;height:32px}
.ft-svg .f{fill:var(--c);stroke:none}
.ft-t{font-weight:800;font-size:15px;line-height:1.2}
.faq-head{display:flex;align-items:center;gap:14px;margin:8px 0 14px;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,transparent)}
.faq-head .faq-t{margin:0}
.faq-pts{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.faq-pts li{position:relative;padding-left:20px;line-height:1.5;font-size:16px}
.faq-pts li::before{content:"";position:absolute;left:4px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--safe)}
.faq-list{list-style:none;margin:0;padding:0}
.faq-list li{border-bottom:1.5px solid var(--line)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;background:none;border:0;color:var(--ink);font:inherit;font-weight:700;text-align:left;cursor:pointer}
.faq-q b{color:var(--mute);font-family:var(--f-mono)}
@media (hover:hover){.faq-q:hover b{color:var(--safe)}}
.faq-back{align-self:flex-start;margin:10px 0 4px;color:var(--mute)}
.faq-t{margin:6px 0 8px;font-family:var(--f-display);font-size:clamp(20px,4.6vw,26px);line-height:1.15}
.faq-a{margin:0 0 12px;line-height:1.5;color:var(--ink)}
.faq-ico{width:100%;border-collapse:collapse;margin-bottom:8px}
.faq-ico td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle}
.fi-i{width:34px}.fi-i .ico{width:22px;height:22px;stroke:var(--safe)}
.fi-n{font-weight:700;white-space:nowrap}
.fi-d{color:var(--mute);font-size:14px;line-height:1.35}
.faq #faq-mode{margin:8px 0}
.faq summary::after{content:"+";font-family:var(--f-mono);color:var(--mute)}
.faq details[open] summary::after{content:"–"}
.faq p{margin:0 4px 10px;line-height:1.45;color:var(--mute)}
.faq .link{margin:0 4px 12px;color:var(--safe)}
.icon-btn{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);transition:box-shadow .15s}
@media (hover:hover){.icon-btn:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--ink)}}
.icon-btn:disabled{opacity:.3}
.chip-btn{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .15s}
@media (hover:hover){.chip-btn:hover{box-shadow:inset 0 0 0 2px var(--ink)}}
.chip-btn b{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--safe)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:54px;padding:0 24px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;border-radius:3px;transition:translate .15s var(--out),background .2s}
@media (hover:hover){.btn:hover{translate:0 -2px}}
.btn:active{translate:0 1px}
.btn .k{opacity:.55}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
@media (hover:hover){.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink)}}
.link{color:var(--mute);padding:10px 0}
@media (hover:hover){.link:hover{color:var(--ink)}}

/* the wire: shared by the title loop and Interceptar */
.wire{position:relative;height:56px;flex:none}
.wire-line{position:absolute;left:0;right:22px;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px)}
.wire-fill{position:absolute;left:0;right:22px;top:50%;height:2px;margin-top:-1px;background:var(--threat);transform-origin:left;transform:scaleX(0)}
.core{position:absolute;right:0;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--safe);background:var(--bg);display:grid;place-items:center}
.core i{width:14px;height:14px;border-radius:50%;background:var(--safe);transition:background .2s}
.core::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px var(--safe);opacity:0;animation:radar 2.4s var(--out) infinite}
.core.pulse{animation:corePulse .45s var(--out)}
.core.hit{box-shadow:inset 0 0 0 2px var(--threat);animation:coreHit .5s}
.core.hit i{background:var(--threat)}
.core.hit::after{box-shadow:inset 0 0 0 2px var(--threat)}
@keyframes radar{0%{scale:1;opacity:.55}100%{scale:2;opacity:0}}
@keyframes corePulse{40%{scale:1.25}}
@keyframes coreHit{20%{scale:.8}60%{scale:1.15}}
.pk{position:absolute;left:0;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--threat);will-change:transform}
.pk.hot{box-shadow:0 0 0 5px color-mix(in srgb,var(--threat) 22%,transparent)}
.pk.dead{opacity:0;transition:opacity .12s}
.beam{position:absolute;top:50%;height:4px;margin-top:-2px;background:var(--safe);opacity:0;pointer-events:none}
.beam.fire{animation:beam .4s var(--out)}
@keyframes beam{0%{opacity:1;scale:1 2.4}100%{opacity:0;scale:1 .2}}

/* title */
#s-title{justify-content:space-between;gap:24px}
.title-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mute)}
.title-main{display:flex;flex-direction:column;gap:22px}
.logo{margin:0;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(52px,14vw,150px);line-height:.86;letter-spacing:-.035em;display:flex;flex-direction:column}
.logo span{display:block;animation:rise .8s var(--out) both}
.logo span+span{animation-delay:.12s;color:var(--bg);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
@keyframes rise{from{opacity:0;translate:0 40%}to{opacity:1;translate:0 0}}
.title-sub{margin:0;max-width:36ch;font-size:clamp(17px,2.2vw,20px);line-height:1.45;color:var(--mute);text-wrap:pretty}
.title-games{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);max-width:640px}
.title-games span{display:inline-flex;align-items:center;gap:6px}
.title-actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.title-progress{color:var(--mute);margin:0}

/* map */
#s-map{gap:clamp(18px,3.5vh,34px)}
.net{position:relative;display:flex;justify-content:space-between;align-items:flex-start;padding-top:6px}
.net-line{position:absolute;left:28px;right:28px;top:34px;height:2px;background:var(--line)}
.net-line i{position:absolute;top:-2px;left:0;width:6px;height:6px;background:var(--threat);animation:travel 7s linear infinite}
.net-line i:nth-child(2){animation-delay:-2.4s}
.net-line i:nth-child(3){animation-delay:-4.8s}
@keyframes travel{from{left:-6px}to{left:100%}}
.node-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;width:56px}
.node-wrap:nth-child(2){align-items:flex-start}
.node-wrap:last-child{align-items:flex-end}
.node{position:relative;width:56px;height:56px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;transition:scale .25s var(--spring),background .2s,color .2s}
@media (hover:hover){.node:hover{scale:1.08}}
.node svg{position:absolute;inset:0;width:100%;height:100%;rotate:-90deg}
.node circle{fill:none;stroke:var(--line);stroke-width:3;transition:stroke .3s}
.node circle.on{stroke:var(--safe)}
.node .core-dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 3px currentColor;background:currentColor}
.node-wrap.is-sel .node{background:var(--ink);color:var(--bg)}
.node-wrap.is-locked .node{color:var(--mute)}
.node-l{white-space:nowrap;color:var(--mute);font-size:11px}
.node-wrap.is-sel .node-l{color:var(--ink)}
@media (max-width:640px){.node-l{display:none}}

.sector{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px}
.sector.swap{animation:enter .35s var(--out)}
.sec-head{display:flex;flex-direction:column;gap:10px}
.sec-meta{margin:0;color:var(--mute)}
.sec-name{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(32px,7vw,62px);line-height:.95;letter-spacing:-.035em;text-transform:uppercase;text-wrap:balance}
.sec-q{margin:0;max-width:56ch;font-size:17px;line-height:1.45;color:var(--mute);text-wrap:pretty}
.locked-note{margin:0;font-weight:700;color:var(--threat)}
.rounds{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:auto;border-top:1.5px solid var(--line);overscroll-behavior:contain}
.round{width:100%;display:grid;grid-template-columns:2.6ch minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:15px 4px;border-bottom:1.5px solid var(--line);transition:background .15s,padding .2s var(--out)}
@media (hover:hover){.round:hover:not(:disabled){background:var(--bg-2);padding-left:12px}}
.round:disabled{color:var(--mute)}
.r-n{color:var(--mute)}
.r-name{font-weight:700;font-size:18px;line-height:1.25}
.r-parts{display:inline-block;margin-left:10px;padding:2px 7px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mute);font-size:11px;font-weight:600;letter-spacing:.04em;vertical-align:middle;white-space:nowrap}
.r-parts.on{color:var(--safe);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--safe) 55%,transparent)}
.mm-part{display:inline-block;margin-left:10px;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.r-ico{display:inline-flex;gap:6px;color:var(--mute)}
/* a finished mission lights up its minigame icon */
.round.is-done .r-ico{color:var(--case);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--case) 70%,transparent))}
.r-kind{color:var(--mute);font-size:11px}
.round.is-next .r-n{color:var(--safe)}
/* the next round says so in words instead of a blinking square */
.round.is-next .r-name::after{content:"Siguiente";display:inline-block;margin-left:10px;padding:2px 8px;border-radius:999px;vertical-align:middle;background:var(--case);color:var(--bg);font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
@keyframes blink{to{visibility:hidden}}
@media (max-width:560px){.r-kind{display:none}.round{grid-template-columns:2.6ch minmax(0,1fr) auto auto;gap:12px}}
.stars{display:inline-flex;gap:7px;align-items:center}
.st{display:block;width:13px;height:13px;background:var(--line);clip-path:polygon(50% 0%,61.8% 35.4%,100% 38.2%,69.1% 61.8%,80.9% 100%,50% 76.4%,19.1% 100%,30.9% 61.8%,0% 38.2%,38.2% 35.4%)}
.st.on{background:var(--gold,#ffd23f);filter:drop-shadow(0 0 4px color-mix(in srgb,#ffd23f 60%,transparent))}

/* briefing */
#s-brief{gap:14px}
.deck{flex:1;min-height:0;display:grid;place-items:center;cursor:pointer;touch-action:pan-y}
.bcard{grid-area:1/1;width:min(580px,100%);max-height:100%;overflow:auto;background:var(--bg);box-shadow:0 0 0 2px var(--ink);border-radius:6px;padding:clamp(24px,4.5vw,44px);display:flex;flex-direction:column;gap:18px;transform:translateY(calc(var(--o,0) * 16px)) scale(calc(1 - var(--o,0) * .05));opacity:calc(1 - var(--o,0) * .4);z-index:calc(10 - var(--o,0));transition:transform .45s var(--out),opacity .45s var(--out)}
.bcard.gone{transform:translateX(-112%) rotate(-7deg);opacity:0;pointer-events:none}
.bcard.far{opacity:0}
.b-tag{margin:0;color:var(--mute)}
.b-term{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,5vw,44px);line-height:1;letter-spacing:-.03em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.b-def{margin:0;font-size:clamp(18px,2.4vw,21px);line-height:1.5;max-width:46ch;text-wrap:pretty}
.deck-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.deck-foot .mono{color:var(--mute);font-variant-numeric:tabular-nums}

/* play shell */
.hud{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;min-height:46px;margin-bottom:12px}
.hud-mid{display:flex;flex-direction:column;gap:7px;min-width:0}
.hud-mid .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.prog{height:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .5s var(--out)}
.hud-r{display:flex;align-items:center;gap:16px}
.shields{display:flex;gap:5px}
.shields i{display:block;width:13px;height:15px;clip-path:polygon(50% 0,100% 16%,100% 58%,50% 100%,0 58%,0 16%);background:var(--line)}
.shields i.on{background:var(--safe)}
.shields i.break{animation:shBreak .55s}
.shields i.heal{animation:shHeal .6s var(--spring)}
@keyframes shBreak{0%{background:var(--threat);scale:1.5}100%{scale:1}}
@keyframes shHeal{0%{scale:0}70%{scale:1.5}100%{scale:1}}
.score{display:flex;align-items:baseline;gap:7px;font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.mult{font-size:12px;color:var(--mute)}
.mult.hot{color:var(--safe)}
.mult.pop{animation:multPop .45s var(--spring)}
@keyframes multPop{0%{scale:1}50%{scale:1.7}100%{scale:1}}
@media (max-width:420px){.hud{gap:10px}.hud-r{gap:10px}.score{font-size:16px}}

.stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.stage.shake{animation:shake .42s}
@keyframes shake{20%{translate:-9px 2px}40%{translate:8px -3px}60%{translate:-5px 1px}80%{translate:3px 0}}
@keyframes nudge{20%{translate:-8px 0}40%{translate:7px 0}60%{translate:-5px 0}80%{translate:3px 0}}
@keyframes chipIn{from{opacity:0;translate:0 8px}}
@keyframes breathe{50%{scale:1.03}}

.game{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px}
.clue-wrap{display:flex;flex-direction:column;gap:10px;flex:none}
.clue-tag{margin:0;color:var(--mute)}
.clue{margin:0;font-size:clamp(21px,3.3vw,31px);line-height:1.28;font-weight:700;max-width:34ch;text-wrap:pretty}
.clue.sm{font-size:clamp(18px,2.5vw,24px);max-width:44ch}
.clue.in{animation:clueIn .45s var(--out)}
@keyframes clueIn{from{opacity:0;translate:0 12px}}
.hint-line{margin:0;color:var(--mute);flex:none}
.bar-time{flex:none;height:2px;background:var(--line)}
.bar-time i{display:block;height:100%;background:var(--safe);transform-origin:left}

/* 01 interceptar */
.mcq{justify-content:space-between}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 16px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:17px;line-height:1.25;transition:box-shadow .15s,background .15s,color .15s,scale .12s}
.opt .k,.chip .k,.tile .k,.plug .k,.zone .k,.tool .k{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:2px;background:var(--bg-2);color:var(--mute)}
@media (hover:hover){.opt:hover{box-shadow:inset 0 0 0 2px var(--ink)}}
.opt:active{scale:.98}
.opt.ok{background:var(--safe);color:var(--on-safe);box-shadow:none}
.opt.ok .k{background:color-mix(in srgb,var(--on-safe) 22%,transparent);color:inherit}
.opt.no{box-shadow:inset 0 0 0 2px var(--threat);color:var(--threat);animation:nudge .38s}
.opt.reveal{box-shadow:inset 0 0 0 2.5px var(--safe)}
@media (max-width:600px){.opts{grid-template-columns:1fr;gap:8px}.opt{min-height:54px;font-size:16px}}

/* 02 clasificar */
.sort{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.bin{position:absolute;top:0;bottom:0;width:50%;cursor:pointer}
.bin-l{left:0}
.bin-r{right:0}
.bin::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,color-mix(in srgb,var(--safe) 16%,transparent),transparent 75%);opacity:0;transition:opacity .2s;pointer-events:none}
.bin-r::before{background:linear-gradient(to left,color-mix(in srgb,var(--safe) 16%,transparent),transparent 75%)}
.bin.lit::before{opacity:1}
.bin.flash::before{animation:binFlash .55s var(--out)}
@keyframes binFlash{0%{opacity:1}100%{opacity:0}}
.bin-head{position:absolute;top:0;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 8px)}
.bin-l .bin-head{left:0;align-items:flex-start;text-align:left}
.bin-r .bin-head{right:0;align-items:flex-end;text-align:right}
.bin-arrow{color:var(--mute)}
.bin-name{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,3.6vw,32px);line-height:1;letter-spacing:-.025em;text-transform:uppercase;overflow-wrap:anywhere}
.bin-sub{color:var(--mute);font-size:14px;line-height:1.3;max-width:20ch}
.lane{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 12px);pointer-events:none}
.drop{position:absolute;left:50%;top:110px;bottom:26px;width:min(360px,74%);translate:-50% 0;pointer-events:none}
.scard{position:absolute;left:0;right:0;top:0;padding:20px;background:var(--bg);box-shadow:0 0 0 2px var(--ink),0 18px 30px -22px color-mix(in srgb,var(--ink) 60%,transparent);border-radius:5px;pointer-events:auto;cursor:grab;touch-action:none}
.scard p{margin:0;font-size:clamp(17px,2.3vw,20px);line-height:1.38;font-weight:700}
.scard.in{animation:cardIn .3s var(--out)}
.scard.bad{box-shadow:0 0 0 2.5px var(--threat);animation:nudge .38s}
@keyframes cardIn{from{opacity:0;scale:.9}}
.floor{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.floor i{position:absolute;inset:0;background:var(--threat);transform:scaleX(0)}

/* 03 circuito */
.seq-body{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;overscroll-behavior:contain}
@media (max-width:640px){.seq-body{grid-template-columns:1fr;gap:18px}}
.chain{list-style:none;margin:0;padding:0}
.slot{position:relative;display:flex;align-items:flex-start;gap:14px;min-height:46px;padding-bottom:12px}
.slot::before{content:"";position:absolute;left:14px;top:30px;bottom:2px;width:2px;background:var(--line);transition:background .3s}
.slot:last-child::before{display:none}
.slot.filled::before{background:var(--safe)}
.dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--mute);transition:background .25s,color .25s,box-shadow .25s}
.slot.filled .dot{background:var(--safe);color:var(--on-safe);box-shadow:none}
.slot-t{padding-top:5px;font-weight:700;line-height:1.3;min-width:0;flex:1}
.slot:not(.filled) .slot-t::before{content:"";display:block;width:55%;height:2px;margin-top:9px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 11px)}
.chain.closed .dot{animation:dotGlow .6s var(--spring) both;animation-delay:calc(var(--i) * 70ms)}
@keyframes dotGlow{50%{scale:1.35}}
.pool{display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;line-height:1.3;transition:opacity .25s,scale .25s,box-shadow .15s}
@media (hover:hover){.chip:hover{box-shadow:inset 0 0 0 2px var(--ink)}}
.chip.used{opacity:0;scale:.95;pointer-events:none}
.chip.gone{display:none}
.chip.no{box-shadow:inset 0 0 0 2px var(--threat);color:var(--threat);animation:nudge .38s}
.chip.hint{box-shadow:inset 0 0 0 2.5px var(--safe);animation:breathe 1s ease-in-out infinite}

/* 04 diagrama (drag and drop) */
.dg-zones{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:clamp(14px,3.4vw,48px);row-gap:12px;align-content:start;align-items:start;padding:clamp(6px,calc(18vh - 40px),240px) 2px 8px}
.dgm-wires{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none;z-index:0}
.dgm-wires .wb{fill:none;stroke:color-mix(in srgb,var(--case) 40%,var(--line));stroke-width:2}
.dgm-wires .wf{fill:none;stroke:var(--case);stroke-width:4;stroke-linecap:round;stroke-dasharray:0 18;animation:wFlow 1.2s linear infinite;filter:drop-shadow(0 0 3px var(--case))}
.dgm-wires .wa{fill:color-mix(in srgb,var(--case) 75%,var(--ink));stroke:none}
@keyframes wFlow{to{stroke-dashoffset:-18}}
.dgm-wires .on .wb,.dg-zones.done .wb{stroke:var(--safe)}
.dgm-wires .on .wf,.dg-zones.done .wf{stroke:var(--safe);filter:drop-shadow(0 0 5px var(--safe))}
.dgm-wires .on .wa,.dg-zones.done .wa{fill:var(--safe)}
.dg-zones.done .wf{animation-duration:.5s}
.zone{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0;padding:10px 8px 14px;border-radius:10px;cursor:pointer;transition:background .15s,box-shadow .15s}
.zone.hot{background:color-mix(in srgb,var(--safe) 8%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--safe) 45%,transparent)}
.dgm-plate{position:relative;flex:none;display:grid;place-items:center;width:min(100%,180px);aspect-ratio:4/3;border-radius:16px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--case) 20%,var(--bg-2)),var(--bg) 78%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--case) 60%,var(--line)),0 0 22px -6px color-mix(in srgb,var(--case) 70%,transparent);transition:box-shadow .2s,transform .2s var(--out)}
.dg-zones[data-n="2"] .dgm-plate{width:min(100%,220px)}
.dgm-plate .g{width:78%;height:auto;--gw:1.9px}
.dgm-plate .cap{display:none}
.dgm-plate .k{position:absolute;top:7px;left:7px;width:20px;height:20px;font-size:11px}
.zone.hot .dgm-plate{transform:scale(1.05);box-shadow:inset 0 0 0 2.5px var(--safe),0 0 30px -4px var(--safe)}
.zone.full .dgm-plate{box-shadow:inset 0 0 0 2px var(--safe),0 0 24px -8px var(--safe)}
.zone.flash .dgm-plate{animation:plateHit .5s var(--out)}
@keyframes plateHit{0%{transform:scale(1.14);box-shadow:inset 0 0 0 3px var(--safe),0 0 40px 0 var(--safe)}}
.zone.nope .dgm-plate{animation:plateNo .42s}
@keyframes plateNo{0%,60%{box-shadow:inset 0 0 0 2.5px var(--threat),0 0 26px -4px var(--threat)}20%{translate:-6px 0}40%{translate:6px 0}60%{translate:-3px 0}80%{translate:2px 0}}
.dgm-ok{position:absolute;right:-8px;top:-8px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--safe);opacity:0;scale:.4;transition:opacity .2s,scale .3s var(--out)}
.dgm-ok svg{width:14px;height:14px;fill:none;stroke:var(--on-safe);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.zone.full .dgm-ok{opacity:1;scale:1}
.dgm-txt{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;min-width:0;text-align:center}
.zone-l{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.01em;line-height:1.15;overflow-wrap:break-word;min-width:0;max-width:100%;transition:color .2s}
.zone.full .zone-l{color:var(--safe)}
.zone-s{font-size:13px;line-height:1.3;color:var(--mute)}
.zone-in{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.zone-in:empty{display:none}
.ztag{padding:4px 8px;border-radius:3px;background:color-mix(in srgb,var(--safe) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--safe) 35%,transparent);color:var(--safe);font-size:12px;font-weight:700;line-height:1.25;animation:chipIn .35s var(--out)}
/* phones: the same figure, top to bottom */
@media (max-width:640px){
  .dg-zones{grid-template-columns:minmax(0,1fr);row-gap:12px;padding:2px 0 6px}
  .zone{flex-direction:row;align-items:flex-start;gap:12px;padding:6px}
  .dgm-plate,.dg-zones[data-n="2"] .dgm-plate{width:76px;border-radius:12px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--case) 60%,var(--line)),0 0 12px -6px color-mix(in srgb,var(--case) 70%,transparent)}
  .dgm-plate .g{--gw:1.5px}
  .dgm-ok{width:20px;height:20px;right:-6px;top:-6px}
  .dgm-ok svg{width:12px;height:12px}
  .dgm-txt{align-items:flex-start;text-align:left;gap:6px;padding-top:4px}
  .zone-in{justify-content:flex-start;gap:4px}
  .zone-l{font-size:11.5px}
  .ztag{font-size:11.5px;padding:3px 7px}
}
/* short phones: the start screen already said what to do, so the figure gets the room */
@media (max-width:640px) and (max-height:600px){
  .dgm .clue{display:none}
  .dgm-plate,.dg-zones[data-n="2"] .dgm-plate{width:60px;border-radius:10px}
  .dg-zones{row-gap:10px}
  .zone{gap:10px;padding:4px 6px}
  .dgm-txt{padding-top:2px;gap:4px}
  .zone-l{font-size:11px}
  .ztag{font-size:11px;padding:2px 6px}
}
.dg-tray{flex:none;display:flex;flex-wrap:wrap;gap:8px;min-height:48px;align-items:flex-start}
.dchip{padding:11px 14px;border-radius:6px;background:color-mix(in srgb,var(--case) 14%,var(--bg-2));color:var(--ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--case) 55%,var(--line));font-weight:700;font-size:15px;line-height:1.2;touch-action:none;cursor:grab;animation:chipIn .3s var(--out) both;transition:opacity .15s}
.dchip.lifted{opacity:.2}
.dchip.sel{outline:2.5px solid var(--safe);outline-offset:3px}
.dchip.no{animation:nudge .38s;background:var(--threat)}
@media (max-width:640px){.dg-tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.dchip{min-height:50px;padding:8px 11px;font-size:14px;text-align:left}}
.drag-ghost{position:fixed;z-index:70;pointer-events:none;margin:0;scale:1.06;box-shadow:0 16px 30px -12px color-mix(in srgb,var(--ink) 55%,transparent);animation:none;opacity:1}

/* 05 cableado (draw) */
.wr-board{position:relative;flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,.85fr) minmax(38px,.45fr) minmax(0,1.3fr);overscroll-behavior:contain}
.wr-svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:3}
.wr-col{display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:4px}
.wr-l{grid-column:1}
.wr-r{grid-column:3}
.plug{position:relative;z-index:1;display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 12px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--bg);font-weight:700;line-height:1.25;text-align:left;touch-action:none;transition:box-shadow .15s,color .15s}
.pl{padding-right:18px}
.pr{padding-left:18px}
.plug-t{font-family:var(--f-display);font-weight:600;font-size:12.5px;text-transform:uppercase;flex:1;min-width:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.plug-d{font-size:15px;flex:1;min-width:0}
.jack{position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
.pl .jack{right:-7px}
.pr .jack{left:-7px}
.plug.sel{box-shadow:inset 0 0 0 2px var(--ink)}@media (hover:hover){.plug:hover{box-shadow:inset 0 0 0 2px var(--ink)}}
.plug.sel .jack{background:var(--safe);box-shadow:none}
.plug.hot{box-shadow:inset 0 0 0 2.5px var(--safe)}
.plug.done{box-shadow:inset 0 0 0 1.5px var(--safe);color:var(--safe);cursor:default}
.plug.done .jack{background:var(--safe);box-shadow:none}
.plug.no{animation:nudge .38s;box-shadow:inset 0 0 0 2px var(--threat)}
.cable{fill:none;stroke-width:3;stroke-linecap:round}
.cable.live{stroke:var(--ink);stroke-dasharray:6 7}
.cable.on{stroke:var(--safe)}
.cable.bad{stroke:var(--threat);animation:fadeOut .6s forwards}
@keyframes fadeOut{to{opacity:0}}
@media (max-width:600px){.wr-board{grid-template-columns:minmax(0,1.05fr) 26px minmax(0,1fr)}.pl{flex-direction:column;align-items:flex-start;gap:5px}.pl .plug-t{flex:none;width:100%}.plug-t{font-size:11px}.plug-d{font-size:14px}.plug{padding:9px 10px}.pl{padding-right:16px}.pr{padding-left:16px}.plug .k{display:none}}

/* 06 carrera (runner) */
.track{position:relative;flex:1;min-height:250px;overflow:hidden;touch-action:none;border-block:2px solid var(--ink)}
.sep{position:absolute;left:0;right:0;height:2px;margin-top:-1px;background-image:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 26px)}
.runner{position:absolute;left:0;top:0;width:24px;height:24px;background:var(--safe);transition:transform .14s var(--out);z-index:2}
.runner::after{content:"";position:absolute;right:100%;top:7px;width:34px;height:10px;background:linear-gradient(to left,color-mix(in srgb,var(--safe) 50%,transparent),transparent)}
.runner.crash{background:var(--threat);animation:nudge .4s}
.gate{position:absolute;left:0;top:0;bottom:0;width:min(230px,46%);display:grid;grid-template-rows:repeat(3,1fr);gap:8px;padding-block:6px;will-change:transform;z-index:1}
.door{display:flex;align-items:center;gap:8px;padding:6px 10px;border-left:5px solid var(--ink);background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:15px;line-height:1.2;cursor:pointer;overflow:hidden}
.door.mine{box-shadow:inset 0 0 0 2px var(--ink)}
.door{animation:doorIn .4s var(--out) both}
.door:nth-child(2){animation-delay:.06s}
.door:nth-child(3){animation-delay:.12s}
@keyframes doorIn{from{opacity:0;translate:28px 0}to{opacity:1;translate:0 0}}
.door.ok{border-left-color:var(--safe);box-shadow:inset 0 0 0 2px var(--safe);color:var(--safe)}
.door.no{border-left-color:var(--threat);box-shadow:inset 0 0 0 2px var(--threat);color:var(--threat)}
.bit{position:absolute;left:0;top:0;width:10px;height:10px;background:var(--ink);opacity:.75}
@media (max-width:600px){.door{font-size:14px}}

/* 07 pares (memory) */
.mm-grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(118px,176px);align-content:center;gap:10px;overscroll-behavior:contain;padding:2px}
.mm-grid.wide{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:640px){.mm-grid,.mm-grid.wide{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(92px,auto)}}
.mc{display:block;width:100%;height:100%;min-height:92px;perspective:900px}
.mc-in{position:relative;display:block;width:100%;height:100%;min-height:inherit;transform-style:preserve-3d;transition:transform .45s var(--out)}
.mc.up .mc-in,.mc.done .mc-in{transform:rotateY(180deg)}
.mc-f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center}
.mc-back{background:var(--bg-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.mc-back i{width:14px;height:14px;rotate:45deg;box-shadow:inset 0 0 0 2px var(--line)}
@media (hover:hover){.mc:hover .mc-back{box-shadow:inset 0 0 0 2px var(--ink)}}
.mc-front{transform:rotateY(180deg);background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink)}
.mc-front.t{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;line-height:1.2;overflow-wrap:anywhere}
.mc-front.d{font-size:14px;font-weight:700;line-height:1.3}
.mc.done .mc-front{box-shadow:inset 0 0 0 2px var(--safe);color:var(--safe)}
.mc.no .mc-front{box-shadow:inset 0 0 0 2px var(--threat)}

/* 08 descifrar */
.wd{justify-content:center;gap:26px}
.wd-slots{display:flex;justify-content:center;gap:5px}
.ls{flex:0 1 44px;min-width:0;height:56px;display:grid;place-items:center;border-bottom:3px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:clamp(15px,4.6vw,26px);text-transform:uppercase}
.ls.on{border-bottom-color:var(--ink);animation:letterIn .3s var(--spring)}
@keyframes letterIn{from{scale:1.6;opacity:0}}
.ls.rev{color:var(--threat);border-bottom-color:var(--threat)}
.wd-slots.win .ls{border-bottom-color:var(--safe);color:var(--safe)}
.gap{flex:0 0 14px}
.wd-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:600px;margin-inline:auto}
.tile{width:50px;height:54px;display:grid;place-items:center;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--f-mono);font-weight:600;font-size:21px;transition:opacity .2s,scale .2s,box-shadow .15s}
@media (hover:hover){.tile:hover{box-shadow:inset 0 0 0 2px var(--ink)}}
.tile.scr{color:var(--mute)}
.tile.used{opacity:0;scale:.7;pointer-events:none}
.tile.no{animation:nudge .35s;box-shadow:inset 0 0 0 2px var(--threat);color:var(--threat)}
.tile.hint{box-shadow:inset 0 0 0 2.5px var(--safe);animation:breathe 1s infinite}
@media (max-width:420px){.tile{width:42px;height:48px;font-size:18px}}

/* 09 escaner (snake) */
.sn-box{position:relative;flex:1;min-height:240px;touch-action:none;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:4px;overflow:hidden;cursor:crosshair}
.sn-box canvas{position:absolute;inset:0;width:100%;height:100%}

/* 10 portero (gatekeeper): the queue, the packet at the checkpoint, the firewall gate and the network behind it */
.clue.xs{font-size:clamp(15px,2.1vw,19px);font-weight:600;max-width:50ch}
.gt{gap:12px}
.gt-top{display:flex;align-items:center;gap:12px;flex:none}
.gt-top .gt-qd{margin-left:0}
.gt-top .gt-rule-b{margin-left:auto}
.gt-top .clue-tag{margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt-rule-b{flex:none;padding:5px 11px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.gt-rule-b[aria-expanded="true"]{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--case)}
.gt-rule{flex:none;margin:0;padding:10px 12px;border-radius:4px;background:color-mix(in srgb,var(--case) 10%,var(--bg));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--case) 50%,transparent);font-size:15px;line-height:1.4}
.gt-field{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;touch-action:none}
.gt-src{display:flex;align-items:center;gap:7px;flex:none;color:var(--mute)}
.gt-src svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4}
.gt-qd{display:flex;align-items:center;gap:4px;margin-left:auto}
.gt-qd i{display:block;width:9px;height:12px;border-radius:2px;background:color-mix(in srgb,var(--case) 55%,var(--line))}
.gt-qd b{margin-left:4px;font-weight:600;color:var(--ink)}
.gt-pipe{position:absolute;left:50%;top:26px;bottom:20px;width:12px;translate:-50% 0;background:linear-gradient(var(--line),var(--line)) center/1.5px 100% no-repeat,radial-gradient(circle,var(--mute) 0 2.6px,transparent 3.2px) center 0/12px 18px repeat-y;animation:gtFlow .9s linear infinite;opacity:.6}
.gt-slot{position:relative;flex:1;min-height:90px;width:100%;max-width:620px;align-self:center}
.gt-pkt{position:absolute;left:0;right:0;top:0;translate:var(--dx,0px) var(--y,0px);rotate:calc(var(--dx,0px) / 18);cursor:grab;touch-action:none;display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--bg);border-radius:4px;box-shadow:inset 0 0 0 2.5px var(--ink),0 18px 30px -24px color-mix(in srgb,var(--ink) 70%,transparent);overflow:hidden;transition:transform .36s var(--out),opacity .36s}
.gt-pkt.in{animation:gtIn .3s var(--out)}
.gt-pkt.drag{transition:none;cursor:grabbing}
.gt-pkt.low{box-shadow:inset 0 0 0 2.5px var(--threat),0 0 26px -6px var(--threat)}
.gt-pkt.to-l{box-shadow:inset 0 0 0 3px var(--threat),0 0 30px -6px var(--threat)}
.gt-pkt.to-r{box-shadow:inset 0 0 0 3px var(--safe),0 0 30px -6px var(--safe)}
.gt-pkt::before,.gt-pkt::after{position:absolute;top:50%;translate:0 -50%;font-family:var(--f-display);font-weight:800;font-size:18px;opacity:.35}
.gt-pkt::before{content:"‹";left:6px;color:var(--threat)}
.gt-pkt::after{content:"›";right:6px;color:var(--safe)}
.gt-pkt.to-l::before,.gt-pkt.to-r::after{opacity:1}
@keyframes gtIn{from{opacity:0;translate:0 -40px;scale:.9}}
.gt-x{margin:0;padding:0 10px;font-size:clamp(18px,4.8vw,25px);line-height:1.22;font-weight:700;text-align:center;text-wrap:balance}
.gt-pkt.back{transform:translate(-12%,-75%) rotate(-11deg) scale(.82);opacity:0}
.gt-pkt.thru{transform:translateY(70%) scale(.3);opacity:0;transition-timing-function:cubic-bezier(.55,0,.85,.35)}
.gt-pkt.no{box-shadow:inset 0 0 0 3px var(--threat);animation:nudge .38s}
.gt-stamp{position:absolute;left:50%;top:50%;padding:3px 12px;border:3px solid currentColor;border-radius:4px;background:color-mix(in srgb,var(--bg) 78%,transparent);font-family:var(--f-display);font-weight:800;font-size:clamp(17px,4.6vw,24px);line-height:1.15;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;pointer-events:none;translate:-50% -50%;rotate:-8deg;animation:stamp .2s cubic-bezier(.3,1.5,.6,1) both}
.gt-stamp.blk{color:var(--threat)}
.gt-stamp.ok{color:var(--safe);rotate:6deg}
@keyframes stamp{from{opacity:0;scale:1.9}}
.gt-fw{position:relative;flex:none;height:14px;margin-top:6px}
.gt-doors{display:flex;height:100%;overflow:hidden}
.gt-doors i{flex:1;background:repeating-linear-gradient(135deg,var(--ink) 0 6px,transparent 6px 11px);box-shadow:inset 0 0 0 1.5px var(--ink);transition:translate .2s var(--out)}
.gt-fw .mono{position:absolute;left:50%;top:50%;translate:-50% -50%;padding:2px 9px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:2px;font-size:10.5px;line-height:1.2;transition:opacity .15s}
.gt-fw.open .gt-doors i:first-child{translate:-28% 0}
.gt-fw.open .gt-doors i:last-child{translate:28% 0}
.gt-fw.open .mono{opacity:0}
.gt-fw.hold{animation:gtHold .45s}
@keyframes gtHold{0%{box-shadow:0 0 0 5px color-mix(in srgb,var(--safe) 50%,transparent)}}
.gt-fw.hit{animation:gtHit .5s}
@keyframes gtHit{0%{box-shadow:0 0 0 6px var(--threat)}}
.gt-net{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--mute)}
.gt-nodes{display:flex;gap:8px;margin-left:auto}
.gt-nodes i{display:block;width:24px;height:21px;color:var(--ink)}
.gt-nodes svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.gt-nodes i.ping{animation:gtPing .55s var(--out)}
@keyframes gtPing{0%,55%{color:var(--safe);translate:0 -4px}}
.gt-nodes i.bad{color:var(--threat)}
.gt-nodes i.bad rect{fill:color-mix(in srgb,var(--threat) 28%,transparent)}
.gt-nodes i.pop{animation:popIn .35s var(--spring)}
.gt-net.shake{animation:shake .42s}
@media (max-height:640px){.gt-net .mono{display:none}.gt{gap:10px}}
@media (max-height:580px){.gt-src span:first-of-type{display:none}.gt-slot{min-height:76px}}
/* 11 auditor */
.au{justify-content:center;gap:26px}
.au-s{margin:0;font-size:clamp(22px,3.6vw,34px);line-height:1.5;font-weight:700;max-width:32ch;text-wrap:pretty}
.seg{display:inline;padding:0 2px;border-radius:2px;background-image:linear-gradient(var(--line),var(--line));background-size:100% 2px;background-position:0 100%;background-repeat:no-repeat;transition:background-color .15s,color .15s;animation:chipIn .35s var(--out) both;animation-delay:calc(var(--i) * 22ms)}
@media (hover:hover){.seg:hover{background-color:var(--bg-2)}}
.seg.caught{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--threat);text-decoration-thickness:3px;background-image:none}
.seg.no{color:var(--threat);animation:nudge .38s}
.fix{display:inline-block;margin-left:8px;color:var(--safe);animation:fixIn .45s var(--spring) both}
@keyframes fixIn{from{opacity:0;scale:.4;translate:0 -10px}}

/* 12 contramedida (tower defense) */
.tw-field{position:relative;flex:1;min-height:clamp(150px,30vh,240px);overflow:hidden;border-bottom:3px solid var(--ink)}
.tw-col{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--line)}
.threat{position:absolute;left:0;top:0;padding:10px;border-radius:3px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700;font-size:14px;line-height:1.25;text-align:left;cursor:pointer;will-change:transform}
.threat::before{content:"";display:block;width:10px;height:10px;margin-bottom:7px;background:var(--threat)}
.threat.target{box-shadow:inset 0 0 0 2.5px var(--threat)}
/* the target label sits on its own line next to the red square, so it never collides with it on narrow cards */
.threat.target::before{content:"Objetivo";width:auto;height:auto;padding-left:15px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:12px;color:var(--threat);background:linear-gradient(var(--threat),var(--threat)) left center/10px 10px no-repeat}
@media (max-width:420px){.threat{font-size:13px;padding:8px}}
.threat.hit{box-shadow:inset 0 0 0 2.5px var(--threat);color:var(--threat);animation:nudge .38s}
.tw-tools{flex:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:700px){.tw-tools{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:62px;padding:9px 10px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:14px;line-height:1.15;transition:box-shadow .15s,background .15s,color .15s}
@media (hover:hover){.tool:hover{box-shadow:inset 0 0 0 2px var(--ink)}}
.tool.fire{animation:toolFire .4s var(--out)}
@keyframes toolFire{0%{background:var(--safe);color:var(--on-safe)}}
.tool.no{animation:toolNo .5s}
@keyframes toolNo{0%,70%{box-shadow:inset 0 0 0 2px var(--threat)}20%{translate:-6px 0}40%{translate:5px 0}}
.tw-label{margin:2px 0 0;color:var(--mute);flex:none}
.tool > span:last-child{overflow-wrap:anywhere;hyphens:manual}
@media (max-height:720px){.game:has(.tw-field) .clue{font-size:clamp(16px,2.2vw,20px)}.tool{min-height:52px;padding:7px 9px;gap:5px;font-size:13px}.tw-tools{gap:6px}}
@media (max-height:620px){.tw-label{display:none}.game:has(.tw-field){gap:10px}}
.laser{position:fixed;left:0;top:0;height:3px;margin-top:-1.5px;transform-origin:0 50%;z-index:55;pointer-events:none;animation:fadeOut .35s var(--out) forwards}

/* overlays inside play */
.sheet,.pause,.intro{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column}
.sheet{justify-content:flex-end;background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet-panel{background:var(--bg);border-top:3px solid var(--threat);padding:18px 0 4px;display:flex;flex-direction:column;gap:10px;animation:sheetUp .38s var(--out);max-height:100%;overflow:auto}
.sheet.good .sheet-panel{border-top-color:var(--safe)}
@keyframes sheetUp{from{translate:0 40px;opacity:0}}
.sh-head{margin:0;color:var(--threat)}
.sheet.good .sh-head{color:var(--safe)}
.sh-quote{margin:0;color:var(--mute);font-size:16px;line-height:1.4;max-width:62ch}
.sh-term{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4vw,34px);line-height:1.05;letter-spacing:-.025em;text-transform:uppercase;overflow-wrap:anywhere}
.sh-rule{margin:-4px 0 4px;font-weight:700;font-size:15px;line-height:1.4;color:var(--ink)}
.sh-sub{margin:0;color:var(--mute)}
.sh-why{margin:0;font-size:18px;line-height:1.5;max-width:62ch;text-wrap:pretty}
.sheet-panel .btn{align-self:flex-start;margin-top:6px}
.rep-link{display:inline-flex;align-items:center;justify-content:center;align-self:center;min-height:36px;margin-top:6px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);background:color-mix(in srgb,var(--bg-2) 70%,transparent);color:var(--mute);font-size:13px;font-weight:700;text-decoration:none}
@media (hover:hover){.rep-link:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}}
.sheet-panel .rep-link{align-self:flex-start}
#pa-rep{margin:4px 0 0}
.pause{justify-content:center;gap:18px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:enter .3s var(--out)}
.pause-t{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,64px);letter-spacing:-.035em;text-transform:uppercase;line-height:.95}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.intro{justify-content:center;gap:14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);cursor:pointer}
.intro .mono{margin:0;color:var(--mute)}
.intro{align-items:center;text-align:center}
.intro > *{max-width:640px}
.intro .demo{margin-inline:auto}
.intro-ico{width:40px;height:40px;color:var(--safe);stroke-width:1.4;animation:rise .5s var(--out) both}
.intro-name{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(40px,10vw,96px);line-height:.88;letter-spacing:-.04em;text-transform:uppercase;animation:rise .55s var(--out) both}
.intro-d{margin:0;font-size:clamp(18px,2.5vw,21px);line-height:1.45;max-width:40ch;animation:rise .55s .08s var(--out) both;text-wrap:pretty}
.count{height:76px;font-family:var(--f-display);font-weight:800;font-size:68px;line-height:76px;color:var(--safe)}
.count.go{animation:countPop .5s var(--out)}
@keyframes countPop{0%{scale:1.8;opacity:0}40%{scale:1;opacity:1}100%{opacity:.25}}
.toast{position:absolute;left:50%;top:3px;z-index:30;max-width:100%;overflow:hidden;text-overflow:ellipsis;translate:-50% -8px;padding:12px 18px;background:var(--ink);color:var(--bg);border-radius:999px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .2s,translate .35s var(--spring)}
.toast.show{opacity:1;translate:-50% 0}

/* floating score + hit flash + particles */
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
#hitflash{position:fixed;inset:0;z-index:49;pointer-events:none;box-shadow:inset 0 0 0 7px var(--threat);opacity:0}
#hitflash.go{animation:flash .5s var(--out)}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.popt{position:fixed;z-index:60;pointer-events:none;font-family:var(--f-mono);font-weight:600;font-size:16px;color:var(--safe);translate:-50% -50%;animation:popUp 1.5s var(--out) forwards}
@keyframes popUp{0%{opacity:0;translate:-50% -30%;scale:.8}12%{opacity:1;translate:-50% -90%;scale:1.15}20%{scale:1}75%{opacity:1;translate:-50% -170%}100%{opacity:0;translate:-50% -230%;scale:1}}

/* end */
#s-end{justify-content:center}
.end{display:flex;flex-direction:column;gap:22px;max-height:100%;overflow:auto;padding-block:8px}
.end-tag{margin:0;color:var(--mute)}
.end-title{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(46px,11vw,112px);line-height:.86;letter-spacing:-.04em;text-transform:uppercase;animation:rise .7s var(--out) both}
.end.fail .end-title{color:var(--threat)}
.glitch{animation:glitch .5s steps(2) 3 both!important}
@keyframes glitch{0%{translate:0 0;clip-path:inset(0 0 0 0)}25%{translate:-6px 0;clip-path:inset(20% 0 40% 0)}50%{translate:5px 0;clip-path:inset(0 0 0 0)}75%{translate:-2px 0;clip-path:inset(55% 0 10% 0)}100%{translate:0 0;clip-path:inset(0 0 0 0)}}
.end-sub{margin:0;font-size:18px;line-height:1.45;max-width:46ch;color:var(--mute)}
.end-stars{display:flex;gap:18px;padding-left:4px}
.end-stars .st{width:30px;height:30px}
.end-stars .st.on{animation:starIn .5s var(--spring) both;animation-delay:var(--d)}
@keyframes starIn{from{scale:0;background:var(--line)}}
.end-stats{display:flex;gap:30px;flex-wrap:wrap;margin:0}
.end-stats div{display:flex;flex-direction:column;gap:4px}
.end-stats dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.end-stats dd{margin:0;font-family:var(--f-mono);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
.end-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.end-chips li{padding:7px 13px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:14px;animation:chipIn .4s var(--out) both;animation-delay:var(--d)}
.end-chips li.new{box-shadow:inset 0 0 0 1.5px var(--safe);color:var(--safe)}
.review{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--line)}
.review li{padding:14px 0;border-bottom:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px}
.review b{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.01em;text-transform:uppercase}
.review span{line-height:1.45;max-width:64ch}

/* archive */
#s-arch{gap:16px}
.arch-head{display:flex;flex-direction:column;gap:6px}
.arch-title{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,52px);line-height:.95;letter-spacing:-.035em;text-transform:uppercase}
.arch-head .mono{margin:0;color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px;flex:none;scrollbar-width:none}
.tab{flex:none;display:flex;align-items:center;gap:10px;padding:10px 15px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700}
.tab .mono{font-size:11px;color:var(--mute)}
.tab.on{background:var(--ink);color:var(--bg);box-shadow:none}
.tab.on .mono{color:inherit;opacity:.7}
.arch-list{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));column-gap:34px;align-content:start;user-select:text;-webkit-user-select:text;overscroll-behavior:contain}
.ent{padding:16px 0;border-bottom:1.5px solid var(--line);display:flex;flex-direction:column;gap:7px;min-width:0}
.ent h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.01em;text-transform:uppercase;line-height:1.25}
.ent p{margin:0;line-height:1.5}
.ent.locked{user-select:none}
.redact{display:block;height:.85em;max-width:100%;background:var(--redact);margin-block:.35em}
.ent.locked .mono{color:var(--threat);font-size:11px}
.arch-foot{display:flex;justify-content:flex-end;flex:none}

/* pictograms: one visual per concept */
.g{display:block;overflow:visible;fill:none;stroke:var(--ink);stroke-width:var(--gw,1.6px);stroke-linecap:round;stroke-linejoin:round}
.g *{vector-effect:non-scaling-stroke}
.g .t{stroke:var(--threat)}
.g .s{stroke:var(--safe)}
.g .mu{stroke:var(--line)}
.g .d{stroke-dasharray:2.5 3}
.g .f{fill:var(--ink);stroke:none}
.g .t .f{fill:var(--threat)}
.g .s .f{fill:var(--safe)}
.g .mu .f{fill:var(--line)}
.g .tf{fill:var(--threat);stroke:none}
.g .sf{fill:var(--safe);stroke:none}
.g .mf{fill:var(--line);stroke:none}
.g text{fill:var(--ink);stroke:none!important;font-family:var(--f-mono);font-weight:600}
.g .t text,.g text.t{fill:var(--threat)}
.g .s text,.g text.s{fill:var(--safe)}
.g-hero{width:100%;height:auto;--gw:2.2px}
.g-md{width:64px;height:48px;--gw:1.5px}
.g-sm{width:46px;height:34px;--gw:1.35px}
.g-xs{width:30px;height:22px;--gw:1.2px}
.g-lock{--ink:var(--line);--threat:var(--line);--safe:var(--line)}
.b-vis{display:flex;justify-content:center;padding-block:2px 4px}
.b-vis .g{width:min(280px,78%);max-height:200px}
.b-term.sm{font-size:clamp(20px,3.6vw,28px)}
.b-vs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.vs-p{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border-radius:4px;background:var(--bg-2)}
.vs-p figcaption{font-family:var(--f-display);font-weight:600;font-size:12px;text-transform:uppercase;text-align:center;line-height:1.2;overflow-wrap:break-word;max-width:100%}
.sh-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:start}
.sh-txt{display:flex;flex-direction:column;gap:10px;min-width:0}
.sh-vis{width:clamp(96px,22vw,210px);padding:8px;border-radius:4px;background:var(--bg-2)}
.o-vis{flex:none;display:grid;place-items:center;width:48px;height:38px;border-radius:2px;background:var(--bg-2)}
.opt.ok .o-vis{background:var(--bg)}
.q-vis{display:block;width:min(280px,66vw);padding:8px 14px;border-radius:4px;background:var(--bg-2)}
.rn .q-vis{width:min(210px,50vw)}
.clue.vis,.clue,.clue.sm,.clue.xs{max-width:none;width:100%;text-wrap:wrap}
.door .g{flex:none}
.bin-head .g{margin-top:6px;width:clamp(64px,10vw,112px);height:auto}
.seq-head{display:flex;align-items:center;justify-content:space-between;gap:16px}
.seq-vis,.wd-vis{flex:none;width:clamp(88px,16vw,160px)}
.wd-head{display:flex;align-items:center;justify-content:space-between;gap:18px}
.seq-head .clue-wrap,.wd-head .clue-wrap{flex:1 1 auto;min-width:0}
.zone-vis{display:flex}
.plug .g{flex:none}
.mc-front.t{flex-direction:column;gap:8px}
.au-vis{display:flex;align-items:center;gap:16px;min-height:80px;opacity:0;transition:opacity .45s var(--out)}
.au-vis.show{opacity:1}
.au-vis .g{width:clamp(96px,14vw,130px)}
.tool-top{display:flex;align-items:center;gap:8px}
.ent{display:grid!important;grid-template-columns:46px minmax(0,1fr);column-gap:14px;align-items:start}
.ent-txt{display:flex;flex-direction:column;gap:7px;min-width:0}
.end-chips li{display:inline-flex;align-items:center;gap:6px}
@media (max-width:600px){.sh-vis{width:96px}.seq-vis,.wd-vis{width:86px}.vs-p{padding:8px 4px}.vs-p figcaption{font-size:11px}.o-vis{width:42px;height:32px}}

.touch .k{display:none!important}
@media (max-width:600px){

.hype{position:absolute;left:50%;top:42%;z-index:15;pointer-events:none;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,76px);line-height:1;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap;color:var(--hype);-webkit-text-stroke:6px var(--bg);paint-order:stroke fill;translate:-50% -50%;opacity:0}
.hype.go{animation:hypeIn 1.6s var(--out) forwards}
.hype.bad{color:var(--threat)}
.hype.win{color:var(--case);white-space:normal;text-align:center;width:max-content;max-width:92vw}
.hype.win::after{content:"superada";display:block;margin-top:6px;font-size:.42em;letter-spacing:.12em;color:var(--ink)}
.hype.win.go{animation:hypeWin 2.3s var(--out) forwards}
#stage.cheer{opacity:.18;filter:blur(3px);transition:opacity .3s,filter .3s}
@keyframes hypeWin{0%{opacity:0;scale:.4}8%{opacity:1;scale:1.15}15%{scale:1}84%{opacity:1;scale:1.04}100%{opacity:0;translate:-50% -70%}}
@keyframes hypeIn{0%{opacity:0;scale:.5}8%{opacity:1;scale:1.12}15%{scale:1}82%{opacity:1;scale:1.05}100%{opacity:0;translate:-50% -90%}}
.popt.crit{color:var(--hype);font-size:19px}
.stage.jolt{animation:jolt .16s var(--out)}

#fever-glow{position:fixed;inset:0;z-index:48;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 5px var(--hype),inset 0 0 80px color-mix(in srgb,var(--hype) 40%,transparent);transition:opacity .3s}

@keyframes feverPulse{to{opacity:.5}}
html.fever{--safe:var(--hype)!important}
.end-grade{display:flex;align-items:center;gap:16px}
.grade{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,16vw,112px);line-height:.8;color:var(--hype);animation:stamp .55s .45s var(--spring) both}
.end-grade .mono{margin:0;color:var(--mute);line-height:1.6}
@keyframes stamp{from{opacity:0;scale:2.4;rotate:-8deg}}
.end-line.hype{color:var(--hype)}
.end-score{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0;max-width:420px}
.end-score .mono{color:var(--mute)}
.end-score b{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1;color:var(--hype);letter-spacing:-.03em}
.end-line.hype.cold{color:var(--mute)}
.sc-beast{color:var(--hype)}
.b-rules{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:clamp(18px,4.4vw,22px);line-height:1.3}

.pf-mode{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

/* ===== interface pass: lane options, progress dots, sort buttons, album, two-beat results, case cards, podium ===== */
.mono.hint-line,.mono.st-hint,.mono.arch-sub,.sc-wrap>.mono,.prof>.mono,.pf-mode .mono,.mono.tap-on{font-family:var(--f-body);font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;line-height:1.4}
.intro .intro-mis{color:var(--ink);font-weight:600}

.dots{display:flex;gap:4px;align-items:center;height:8px}
.dots i{flex:1 1 0;max-width:34px;height:6px;border-radius:3px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--ink)}
.dots i.cur{background:color-mix(in srgb,var(--ink) 28%,var(--line))}

.rn-opts{display:grid;gap:6px;flex:none}
.rn-opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:8px 12px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--bg);font-weight:700;font-size:15px;line-height:1.25;text-align:left;transition:box-shadow .15s}
.rn-opt.mine{box-shadow:inset 0 0 0 2px var(--ink)}
.rn-opt.ok{box-shadow:inset 0 0 0 2.5px var(--safe);color:var(--safe)}
.rn-opt.no{box-shadow:inset 0 0 0 2.5px var(--threat);color:var(--threat)}
.rn-opt .g{flex:none}
.ln{display:grid;gap:2px;width:16px;flex:none}

@media (max-width:600px){.track{min-height:180px}.rn-opt{font-size:14px;min-height:42px}}

.threat.in{animation:popIn .35s var(--out)}
@keyframes popIn{from{opacity:0;scale:.92}}

.sort{display:flex;flex-direction:column;gap:10px}
.sort-field{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.sort .drop{top:6px;bottom:22px}

.sort-bins{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sort .bin{position:relative;inset:auto;top:auto;bottom:auto;width:auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;min-height:84px;padding:10px 12px;border-radius:4px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink);text-align:left;overflow:hidden;transition:box-shadow .15s}
.sort .bin-r{align-items:flex-end;text-align:right}
.sort .bin::before{display:none}
.sort .bin.lit{box-shadow:inset 0 0 0 3px var(--safe)}
.sort .bin.flash{animation:binPulse .5s var(--out)}
@keyframes binPulse{30%{background:color-mix(in srgb,var(--safe) 22%,var(--bg))}}
.bin-txt{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:100%}
.sort .bin-name{overflow-wrap:normal;hyphens:auto;-webkit-hyphens:auto}

.sort .bin-name{font-size:clamp(15px,4.2vw,24px)}
.sort .bin-sub{font-size:12.5px;max-width:none}
.sort .bin .g{width:clamp(44px,12vw,72px);height:auto;flex:none;margin:0}
.sort .bin-arrow{flex:none}

.album{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;align-content:start;padding:2px 2px 12px;overscroll-behavior:contain}
.a-bar{flex:none}
.cv-box{display:flex;flex-direction:column;align-items:flex-start;gap:12px;width:min(440px,100%);padding:20px;border-radius:10px;background:var(--bg);box-shadow:0 0 0 2px var(--line),0 24px 60px -30px color-mix(in srgb,var(--ink) 50%,transparent)}
.cv-box.r-1{box-shadow:0 0 0 2.5px var(--safe),0 24px 60px -30px color-mix(in srgb,var(--ink) 50%,transparent)}
.cv-box.r-2{box-shadow:0 0 0 3px var(--gold),0 24px 60px -30px color-mix(in srgb,var(--ink) 50%,transparent)}
.cv-vis{align-self:center;width:min(260px,80%);padding:8px;border-radius:6px;background:var(--bg-2)}
.cv-term{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(24px,7vw,34px);line-height:1;text-transform:uppercase;letter-spacing:-.02em}
.cv-hook{margin:0;font-weight:700;font-size:18px;line-height:1.35}
.cv-def{margin:0;line-height:1.5}
.cv-box .btn{align-self:stretch}

.end.s1 .end-sum,.end.s2 .end-reward{display:none}
.end.s1{justify-content:center;cursor:pointer}
.end-reward,.end-sum{display:flex;flex-direction:column;gap:18px;flex-shrink:0}
.end-sum{gap:16px;width:100%;max-width:640px;animation:enter .4s var(--out) both}
.end.sim{justify-content:center}
.sim-sh{gap:9px}
.sim-sh i{width:30px;height:35px}
.big-pts{display:flex;flex-direction:column;gap:4px;margin:0}
.big-pts .mono{color:var(--mute)}
.big-pts b{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,13vw,84px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big-pts.hot b{color:var(--hype)}
.pack.big{gap:12px}
.pack.big .pcard{width:clamp(96px,27vw,150px);height:clamp(128px,36vw,200px)}
.pack.big .pc-front b{font-size:14px}
.tap-on{margin:0;color:var(--mute);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.xp-big{display:flex;flex-direction:column;gap:4px;margin:0}
.xp-big .mono{color:var(--mute)}
.xp-big b{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,10vw,64px);line-height:1;color:var(--safe);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.xp-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}

.xp-chips li span{font-family:var(--f-body);font-weight:400;color:var(--mute);margin-right:5px}


#s-league{gap:12px}
.lg-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain;padding-bottom:8px}

.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;padding-top:6px}

.lg-gap{margin:0;font-weight:700;font-size:16px;line-height:1.35;text-align:center}

/* ===== teacher panel ===== */
[hidden]{display:none!important}
.tabbar{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.tc-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:12px;overscroll-behavior:contain}

.tc-open{text-align:right;font-family:var(--f-body);font-size:12px;line-height:1.2;color:var(--mute);white-space:nowrap}

/* ===== minimal map: the case nodes and the next mission ===== */
.mm{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:clamp(4px,3vh,32px)}

@media (max-height:640px){#s-map{gap:8px}.map-scroll{gap:10px}.mm{padding-top:0;gap:8px}.mm-name{font-size:clamp(26px,7.4vw,40px)}.mm-cta{margin-top:2px}.mm-cta .btn.big{min-height:54px}.net .node{width:48px;height:48px}.net-line{top:30px}}
.mm-review{color:var(--safe)}

.arch-net{margin:0;font-size:14px;color:var(--mute)}

.album .fc.inf{box-shadow:inset 0 0 0 2.5px var(--threat)}
.fc-inf{position:absolute;top:38px;right:14px;z-index:2;padding:1px 6px;border-radius:2px;background:var(--threat);color:var(--on-safe);font-family:var(--f-mono);font-size:9.5px;font-weight:600;line-height:1.5;letter-spacing:.06em;text-transform:uppercase}
.mi-link{padding:4px 0;color:var(--safe)}

@media (max-height:720px){.mi-box{gap:9px;padding:16px 16px 14px}.mi-box .cv-term{font-size:clamp(22px,6.4vw,30px)}.mi-box .cv-def{font-size:14px;line-height:1.35}.mi-box .btn{min-height:48px}}
@media (max-height:600px){.mi-box .cv-def{display:none}.mi th,.mi td{padding:4px}}
@media (max-height:560px){.mi-box{gap:6px;padding:12px}.mi-box .cv-term{font-size:20px}.mi-box .btn{min-height:42px}}

.b-rules{font-size:clamp(15px,3.8vw,19px)!important}
.mm-list{gap:10px}

@media (max-height:640px){.mm-cta .mm-list{min-height:54px}.mm-links .link{padding:3px 0}.mm-cta{gap:4px 16px}}
.ml-head{display:flex;align-items:center;justify-content:space-between;gap:12px}

.map-scroll .sector .rounds{border-top:1.5px solid var(--line)}

/* ===== title: two mode cards and a big play button ===== */
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:720px}

.title-cta .btn.big{min-height:76px;padding:0 56px;font-size:20px}

/* ===== flashcards: album, big card, share ===== */
.album{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
@media (max-width:440px){.album{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fc{position:relative;display:flex;flex-direction:column;gap:6px;height:158px;padding:8px;border-radius:10px;background:var(--bg);box-shadow:inset 0 0 0 2px var(--ink);text-align:left;overflow:hidden;min-width:0;transition:translate .15s var(--out),box-shadow .2s}
@media (hover:hover){.fc:hover{translate:0 -3px}}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.fc-art{flex:1;min-height:0;display:grid;place-items:center;border-radius:6px;background:var(--bg-2)}
.fc-art .g{width:86%;height:auto;max-height:100%}
.fc-name{font-family:var(--f-display);font-weight:800;font-size:13px;line-height:1.05;text-transform:uppercase;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.fc-name.long{font-size:11px}
.fc.r-1{box-shadow:inset 0 0 0 2.5px var(--safe)}

.fc.r-1 .fc-rar{color:var(--safe)}
.fc.r-2{box-shadow:inset 0 0 0 3px var(--gold);background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 18%,var(--bg)),var(--bg) 70%)}

.fc.locked{box-shadow:inset 0 0 0 2px var(--line);background:var(--bg-2)}
.fc.locked .fc-art{background:transparent}
.fc.locked .fc-name{color:var(--mute)}
.shine{position:absolute;inset:-40%;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.55) 49%,transparent 56%);mix-blend-mode:soft-light;transform:translateX(var(--mx,-30%));opacity:.55}
.r-2 > .shine,.r-2 .flash-front > .shine{opacity:.95;animation:holo 3.4s ease-in-out infinite}

/* ===== arcade look ===== */
/* answers, tools and bins wear the case colour */
.opt,.tool{background:color-mix(in srgb,var(--case,var(--safe)) 7%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--case,var(--safe)) 45%,var(--line))}
.opt .k,.tool .k{background:color-mix(in srgb,var(--case,var(--safe)) 22%,var(--bg-2));color:var(--ink)}
@media (hover:hover){.opt:hover,.tool:hover{box-shadow:inset 0 0 0 2px var(--case,var(--safe)),0 0 14px color-mix(in srgb,var(--case,var(--safe)) 35%,transparent)}}
.opt.ok{background:var(--safe);color:var(--on-safe);box-shadow:0 0 18px color-mix(in srgb,var(--safe) 55%,transparent)}
.opt.no{background:color-mix(in srgb,var(--threat) 12%,transparent);box-shadow:inset 0 0 0 2px var(--threat)}
.opt.reveal{box-shadow:inset 0 0 0 2.5px var(--safe)}
.sort .bin{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--case,var(--safe)) 45%,var(--line))}
@property --case{syntax:"<color>";inherits:true;initial-value:#00e0ff}
:root{--case:#00e0ff;transition:--case .5s ease}
html.calm{transition:none}
body{background:radial-gradient(60% 45% at 8% 0%,color-mix(in srgb,#ff36d9 22%,transparent),transparent 70%),radial-gradient(55% 45% at 100% 100%,color-mix(in srgb,#00e0ff 20%,transparent),transparent 70%),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/100% 28px,var(--bg)}
.btn{background:var(--safe);color:var(--on-safe);box-shadow:0 10px 28px -12px color-mix(in srgb,var(--safe) 80%,transparent)}
.btn.ghost{background:color-mix(in srgb,var(--bg-2) 60%,transparent);box-shadow:inset 0 0 0 1.5px var(--line)}
.logo span:first-child{background:linear-gradient(90deg,#ff36d9,#ffd23f 50%,#00e0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px color-mix(in srgb,#ff36d9 45%,transparent))}
.logo span+span{-webkit-text-stroke-color:#00e0ff;filter:drop-shadow(0 0 12px color-mix(in srgb,#00e0ff 55%,transparent))}
.node circle.on{stroke:var(--c,var(--safe))}
.node span{color:var(--c,var(--ink))}
.node-wrap.is-sel .node{background:var(--c,var(--ink));box-shadow:0 0 26px -4px var(--c,var(--ink))}
.node-wrap.is-sel .node span{color:var(--bg)}
.node-wrap.is-sel .node-l{color:var(--c,var(--ink))}
.mm-name{color:var(--case);text-shadow:0 0 28px color-mix(in srgb,var(--case) 45%,transparent)}
.mm-play{background:var(--case);box-shadow:0 12px 34px -12px var(--case)}
.round.is-next .r-n,.round .r-n{color:var(--case)}
.dots i.on{background:var(--case)}
.dots i.cur{background:color-mix(in srgb,var(--case) 45%,var(--line))}
.gt-pkt,.scard,.threat{box-shadow:inset 0 0 0 2px var(--case),0 0 24px -10px var(--case)}
.mode-card.on{box-shadow:inset 0 0 0 3px #00e0ff,0 0 26px -10px #00e0ff}
.fc.r-0{box-shadow:inset 0 0 0 2px var(--line)}
/* ===== arcade home: player slots ===== */
.t-slots{display:flex;flex-direction:column;gap:10px;width:100%;max-width:540px}
.pslot.chap .sl-p{font-size:15px}
.pslot.chap .sl-n{white-space:normal;overflow:visible;text-overflow:clip;font-size:clamp(15px,4.2vw,20px);line-height:1.15}
.pslot.chap.soon{opacity:.55;cursor:default;background:transparent;box-shadow:none;outline:1.5px dashed var(--line);outline-offset:-1.5px}
.pslot.chap.soon.no{animation:nudge .38s}
.ch-back{align-self:flex-start}
.t-pick{margin:0 0 2px;color:var(--gold)!important;letter-spacing:.2em;animation:blink 1.6s ease-in-out infinite}
.pslot{display:flex;align-items:center;gap:14px;min-height:70px;padding:10px 16px;border-radius:6px;background:color-mix(in srgb,var(--bg-2) 70%,transparent);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;transition:translate .15s var(--out),box-shadow .2s}
.pslot:focus-visible{translate:4px 0;box-shadow:inset 0 0 0 2px var(--c),0 0 26px -8px var(--c);outline:none}@media (hover:hover){.pslot:hover{translate:4px 0;box-shadow:inset 0 0 0 2px var(--c),0 0 26px -8px var(--c);outline:none}}
.pslot.last{box-shadow:inset 0 0 0 2px var(--c),0 0 26px -10px var(--c)}
.pslot.empty{background:transparent;box-shadow:none;outline:1.5px dashed var(--line);outline-offset:-1.5px}
.pslot.empty:focus-visible{outline-color:var(--c)}@media (hover:hover){.pslot.empty:hover{outline-color:var(--c)}}
.sl-p{flex:none;width:42px;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c);text-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.sl-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.sl-n{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sl-m{margin:0;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-bar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}

.ns-l{margin:4px 0 0;color:var(--mute)}
.ns-name,.pf-name{width:100%;min-width:0;padding:6px 2px;border:0;border-bottom:3px solid var(--c,var(--case));border-radius:0;background:transparent;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);letter-spacing:.04em;text-transform:uppercase;caret-color:var(--gold);outline:none}

.ac-blk{position:absolute;left:0;top:0;pointer-events:none;background:var(--gold);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 70%,transparent);opacity:0;animation:acBlink 1.05s steps(1) infinite}
.ac-always .ac-blk,.ac-wrap:focus-within .ac-blk{opacity:1}

.ns-modes .mode-card{padding:12px 14px;gap:4px}

.ns-top{display:flex;align-items:center;gap:14px}

@media (hover:hover){.ns-back:hover{box-shadow:inset 0 0 0 2px var(--c)}}
.ns-go{width:100%;min-height:64px;margin-top:6px;justify-content:center}
/* bigger slots: taller rows on phones, three big cabinets side by side on wide screens */
