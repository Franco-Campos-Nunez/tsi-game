.sq-card{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-radius:8px;background:color-mix(in srgb,var(--case) 7%,var(--bg));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--case) 40%,var(--line));font-weight:700;font-size:clamp(15px,2vw,17px);line-height:1.3;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:box-shadow .2s,background .2s}
.sq-card.drag{z-index:5;cursor:grabbing;scale:1.03;box-shadow:inset 0 0 0 2px var(--case),0 16px 32px -12px var(--case);transition:none}
.sq-card.sel{box-shadow:inset 0 0 0 2px var(--gold),0 0 20px -6px var(--gold)}
.sq-n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg-2);color:var(--mute);font-size:13px;transition:background .2s,color .2s}
.sq-t{flex:1;min-width:0}
.sq-grip{flex:none;width:14px;height:20px;background:radial-gradient(circle,var(--mute) 1.4px,transparent 1.9px) 0 0/7px 7px;opacity:.7}
.sq-card.chk{background:color-mix(in srgb,var(--case) 20%,var(--bg));box-shadow:inset 0 0 0 2px var(--ink),0 0 26px -4px var(--case)}
.sq-card.chk .sq-n{background:var(--ink);color:var(--bg)}
.sq-card.ok{cursor:default;background:color-mix(in srgb,var(--safe) 14%,var(--bg));box-shadow:inset 0 0 0 2px var(--safe)}
.sq-card.ok .sq-n{background:var(--safe);color:var(--on-safe)}
.sq-card.ok .sq-grip{opacity:0}
.sq-card.bad{background:color-mix(in srgb,var(--threat) 16%,var(--bg));box-shadow:inset 0 0 0 2px var(--threat),0 0 24px -6px var(--threat)}
.sq-card.no{animation:nudge .38s}
.sq-list.closed .sq-card{animation:sqWin .6s var(--spring) both;animation-delay:calc(var(--k) * 80ms)}
@keyframes sqWin{45%{scale:1.03;box-shadow:inset 0 0 0 2px var(--safe),0 0 30px -2px var(--safe)}}
.sq-go{width:100%;justify-content:center;flex:none;min-height:56px}
.sq-card{flex:none}
@media (max-width:360px){.sq-card{min-height:0;padding:8px 12px;font-size:14px;line-height:1.25;gap:10px}.sq-n{width:26px;height:26px}.sq-list{gap:6px}}
@media (max-height:620px){.sq-card{min-height:0;padding:8px 12px;font-size:14px;line-height:1.25;gap:10px}.sq-n{width:26px;height:26px}.sq-list{gap:6px}.sq-go{min-height:48px}}
.sq-go:disabled{opacity:.5}
/* ===== juice ===== */
#goodflash{position:fixed;inset:0;z-index:48;pointer-events:none;box-shadow:inset 0 0 70px -10px var(--case);opacity:0}
#goodflash.go{animation:flash .45s var(--out)}
#p-score{display:inline-block}
#p-score.bump{animation:bump .3s var(--spring)}
@keyframes bump{40%{scale:1.35;color:var(--case)}}
.combo-pop{position:fixed;z-index:61;pointer-events:none;translate:-50% -50%;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 14px color-mix(in srgb,var(--gold) 70%,transparent);animation:comboUp .8s var(--out) forwards}
.combo-pop.c2{font-size:19px;color:var(--hype);text-shadow:0 0 16px var(--hype)}
.combo-pop.c3{font-size:24px;background:linear-gradient(90deg,#ff36d9,#ffd23f,#00e0ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 10px #ff36d9)}
@keyframes comboUp{0%{opacity:0;scale:.4 .4;rotate:-8deg}25%{opacity:1;scale:1.25;rotate:3deg}100%{opacity:0;scale:1;translate:-50% -160%}}
#stage.glitch{animation:shake .4s,glitch .35s steps(2)}
@keyframes glitch{0%{filter:none}25%{filter:hue-rotate(90deg) saturate(2);clip-path:inset(10% 0 40% 0)}50%{filter:hue-rotate(-60deg);clip-path:inset(50% 0 5% 0)}75%{filter:invert(.15);clip-path:none}100%{filter:none}}
#app.zoom{animation:zoom .35s var(--out)}
@keyframes zoom{30%{scale:1.025}}
.shields.throb{animation:throb .5s var(--out)}
@keyframes throb{25%{scale:1.18;filter:drop-shadow(0 0 8px var(--threat))}}
.hype{text-shadow:0 0 24px currentColor}
.count{text-shadow:0 0 30px var(--case)}
/* moving neon floor behind everything */
#app{z-index:1}
body::before{content:"";position:fixed;left:-10%;right:-10%;bottom:-8%;height:50%;z-index:0;pointer-events:none;background:linear-gradient(color-mix(in srgb,var(--case) 70%,transparent) 2px,transparent 2px) 0 0/60px 60px,linear-gradient(90deg,color-mix(in srgb,var(--case) 70%,transparent) 2px,transparent 2px) 0 0/60px 60px;transform:perspective(320px) rotateX(58deg);transform-origin:50% 100%;mask-image:linear-gradient(transparent,#000 35%);-webkit-mask-image:linear-gradient(transparent,#000 35%);opacity:.55;animation:floor 2.4s linear infinite}
@keyframes floor{to{background-position:0 60px,0 0}}
html.fever body::before{opacity:.7;animation-duration:.8s}
/* buttons: lift, shine, breathe */
.btn{position:relative;overflow:hidden;transition:translate .15s var(--out),box-shadow .2s,scale .1s}
@media (hover:hover){.btn:hover{translate:0 -2px}}
.btn:active{scale:.96}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);translate:-120% 0;pointer-events:none}
@media (hover:hover){.btn:hover::after{animation:shine .7s var(--out)}}
@keyframes shine{to{translate:120% 0}}
.mm-play{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 34px -4px var(--case)}}
.node-wrap.is-sel .node{animation:float 2.2s ease-in-out infinite}
@keyframes float{50%{translate:0 -4px}}
.logo span:first-child{animation:logoGlitch 5s infinite}
@keyframes logoGlitch{0%,92%,100%{translate:0;filter:drop-shadow(0 0 18px color-mix(in srgb,#ff36d9 45%,transparent))}93%{translate:-3px 1px;filter:drop-shadow(3px 0 0 #00e0ff) drop-shadow(-3px 0 0 #ff36d9)}95%{translate:3px -1px}97%{translate:-1px 0;filter:drop-shadow(-2px 0 0 #00e0ff)}}
.opt,.tool{transition:box-shadow .15s,background .15s,color .15s,scale .12s,translate .15s}
@media (hover:hover){.opt:hover,.tool:hover{translate:0 -2px}}
.opt.ok{animation:okPop .35s var(--spring)}
@keyframes okPop{40%{scale:1.05}}
.grade{text-shadow:0 0 40px var(--hype)}
/* touch screens: what a mouse gets on hover, a finger gets on press */
.btn:active::after{animation:shine .45s var(--out)}
.pslot:active,.node:active,.mode-card:active,.tab-b:active,.home-b:active,.tg:active,.icon-btn:active{scale:.95;transition:scale .08s}
html.touch .opt:active,html.touch .tool:active{scale:.96;box-shadow:inset 0 0 0 2px var(--case,var(--safe)),0 0 18px color-mix(in srgb,var(--case,var(--safe)) 45%,transparent)}
.pslot.last{animation:slotGlow 1.8s ease-in-out infinite}
@keyframes slotGlow{50%{box-shadow:inset 0 0 0 2px var(--c),0 0 34px -4px var(--c)}}
.tap-ring{position:fixed;z-index:70;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 2px var(--case);animation:tapRing .45s var(--out) forwards}
@keyframes tapRing{to{scale:5;opacity:0}}
</style>

(() => {
"use strict";

/* ===================== CONTENT (Laudon & Laudon, cap. 8) ===================== */
const C = {
  malware:{s:1,t:"Malware",h:"Cualquier software creado para hacer daño",d:"Software malicioso: programas creados para dañar, espiar o tomar el control de una computadora. Incluye virus, gusanos, caballos de Troya, spyware, keyloggers y ransomware. Llega por correos y adjuntos, descargas, mensajería, anuncios comprometidos y redes sociales.",x:"En 2013 aparecieron 30 millones de cepas nuevas, unas 82.000 por día. Hoy los teléfonos, sobre todo Android, son el blanco principal."},
  virus:{s:1,t:"Virus",h:"Se pega a un archivo y viaja si alguien lo envía",d:"Programa malicioso que se une a otros programas o archivos para poder ejecutarse, casi siempre sin que el usuario lo sepa. Entrega una «carga útil» que puede ser inofensiva (un mensaje) o destructiva: borrar datos, formatear el disco o trabar la memoria. Depende de las personas para esparcirse: alguien envía un adjunto o copia un archivo infectado.",x:"ILOVEYOU (2000) llegaba como adjunto de correo y causó entre US$10.000 y 15.000 millones en daños."},
  gusano:{s:1,t:"Gusano",h:"Salta solo de computadora en computadora",d:"Programa independiente que se copia a sí mismo de una computadora a otra a través de la red. A diferencia del virus, no necesita unirse a otro archivo ni que una persona haga algo, por eso se esparce mucho más rápido. Destruye datos y programas y puede detener redes completas.",x:"Sasser (2004) atacaba direcciones IP al azar y paralizó vuelos de British Airways y hospitales de Hong Kong."},
  troyano:{s:1,t:"Caballo de Troya",h:"Parece un regalo, pero trae malware escondido",d:"Programa que parece inofensivo pero hace algo distinto de lo esperado. No es un virus porque no se reproduce: su función es abrir la puerta para que entren virus u otro malware. Su nombre viene del caballo de madera con que los griegos entraron a Troya.",x:"Zeus roba las claves del banco capturando lo que tecleas. Más del 70% de las infecciones que encontró Panda eran troyanos."},
  driveby:{s:1,t:"Descarga oculta",h:"Malware escondido en algo que descargas",d:"Descarga oculta (drive-by): malware que viene incluido en un archivo que el usuario pidió descargar, a propósito o sin darse cuenta. El usuario cree que baja algo legítimo y junto con eso instala el programa malicioso.",x:"Supuestos «visores de imágenes» de Instagram traían malware que redirigía sitios e instalaba programas sin permiso."},
  sqli:{s:1,t:"Inyección de SQL",h:"Mete código en un formulario web mal validado",d:"Ataque que aprovecha una aplicación web mal programada que no valida lo que el usuario escribe en un formulario. El atacante escribe una consulta SQL falsa que llega a la base de datos, y así puede leerla, plantar código malicioso o entrar a otros sistemas de la red.",x:"Una aplicación web grande tiene cientos de campos de entrada: cada uno es una oportunidad de inyección."},
  ransomware:{s:1,t:"Ransomware",h:"Secuestra tus archivos y pide rescate",d:"Malware que extorsiona: toma el control de la computadora o cifra sus archivos y exige un pago para devolver el acceso. Funciona igual en computadores y teléfonos. Se contagia al abrir un adjunto infectado, hacer clic en un vínculo de un correo o visitar un sitio malicioso.",x:"CryptoLocker cifraba los archivos y cobraba cientos de dólares por devolverlos."},
  spyware:{s:1,t:"Spyware",h:"Te espía mientras navegas y te llena de anuncios",d:"Programas pequeños que se instalan solos, de forma furtiva, para vigilar la navegación del usuario y mostrarle publicidad. Algunos además cambian la página de inicio, redirigen las búsquedas o ponen lenta la computadora. Violan la privacidad del usuario.",x:"Se han documentado miles de formas de spyware; el keylogger es su variante más peligrosa."},
  keylogger:{s:1,t:"Keylogger",h:"Graba todo lo que tecleas",d:"Tipo de spyware que registra cada tecla que se pulsa. Con eso roba contraseñas, accesos a cuentas de correo, números de serie de software y números de tarjetas de crédito o cuentas bancarias.",x:"El troyano Zeus usa un keylogger para robar las credenciales bancarias."},
  hacker:{s:1,t:"Hacker",h:"Entra a sistemas sin permiso",d:"Persona que intenta obtener acceso no autorizado a un sistema computacional, buscando debilidades en la protección de sitios web y sistemas. Dentro de esa comunidad, cracker es el hacker con intenciones criminales, aunque la prensa usa ambos términos igual. Sus actividades van desde entrar sin permiso hasta robar bienes e información y dañar sistemas.",x:"Los ataques de hackers se aprovechan de que Internet es un sistema abierto y fácil de usar."},
  cibervandalismo:{s:1,t:"Cibervandalismo",h:"Desfigura o destruye un sitio web a propósito",d:"Interrumpir, desfigurar o destruir de forma intencional un sitio web o un sistema de información corporativo. El objetivo no es robar, sino dañar o hacer un mensaje público.",x:"El Ejército Sirio Electrónico tomó el Twitter, el blog y el Facebook de Skype en 2014 y publicó mensajes falsos."},
  spoofing:{s:1,t:"Spoofing",h:"Se hace pasar por otro",d:"Hacerse pasar por otro para ocultar la identidad real, por ejemplo con direcciones de correo falsas. También es redirigir un vínculo a un sitio falso que se ve casi igual al verdadero, para recibir los pedidos y robar los datos de los clientes. El phishing es una forma de spoofing.",x:"eBay, PayPal, Amazon, Walmart y varios bancos están entre las empresas más suplantadas."},
  sniffer:{s:1,t:"Husmeador (sniffer)",h:"Escucha lo que viaja por la red",d:"Programa que monitorea la información que viaja por una red. Usado legítimamente, ayuda a encontrar problemas o actividad criminal en la red. Usado por criminales es muy difícil de detectar y permite robar correos, archivos e informes confidenciales desde cualquier parte de la red.",x:"Los husmeadores también detectan con facilidad el SSID que transmiten los puntos de acceso Wi-Fi."},
  dos:{s:1,t:"Negación de servicio (DoS)",h:"Satura un servidor hasta tumbarlo",d:"Negación de servicio: inundar un servidor web o una red con miles de solicitudes falsas hasta que no da abasto y deja de atender a los usuarios legítimos. No roba ni destruye información, pero deja el sitio fuera de línea. Las pymes son las más vulnerables porque sus redes están menos protegidas.",x:"Typepad sufrió ataques durante cinco días en 2014: sus usuarios no podían entrar a sus blogs."},
  ddos:{s:1,t:"DoS distribuido (DDoS)",h:"Miles de equipos saturan un servidor a la vez",d:"Negación de servicio distribuida: el mismo ataque DoS, pero lanzado desde muchas computadoras a la vez, desde muchos puntos. Casi siempre se usan miles de equipos zombis de una botnet, cuyos dueños no saben que participan.",x:"Para un sitio de comercio electrónico, cada hora caído son ventas perdidas."},
  botnet:{s:1,t:"Botnet",h:"Un ejército de computadoras zombis",d:"Red de computadoras zombis: equipos infectados con malware de bot que abre una puerta trasera, de modo que un atacante los controla a distancia sin que sus dueños lo sepan. Con esos recursos sumados lanza ataques DDoS, campañas de phishing y spam.",x:"El 90% del spam y el 80% del malware del mundo salen de botnets. Grum controló hasta 840.000 equipos."},
  crimen:{s:1,t:"Crimen por computadora",h:"Delito donde la computadora es víctima o arma",d:"Cualquier violación a la ley penal que requiere conocimiento de tecnología computacional para cometerla, investigarla o acusarla. La computadora puede ser el blanco del delito (entrar sin permiso, dañar un sistema) o el instrumento (robar secretos comerciales, defraudar, acosar por correo).",x:"Los delitos más costosos son la negación de servicio, los empleados maliciosos y los ataques web. Costo promedio: US$11,6 millones al año por empresa."},
  identidad:{s:1,t:"Robo de identidad",h:"Usan tus datos para hacerse pasar por ti",d:"Delito en que un impostor obtiene datos personales clave, como el número de identificación (RUT), la licencia de conducir o las tarjetas de crédito, para hacerse pasar por otra persona. Con eso obtiene crédito, mercancía o servicios a nombre de la víctima, o credenciales falsas.",x:"En 2013 afectó a 13,1 millones de consumidores en EE. UU., con pérdidas de US$18.000 millones."},
  phishing:{s:1,t:"Phishing",h:"Correo o sitio falso que pide tus datos",d:"Forma de spoofing: sitios web falsos o correos que imitan a empresas legítimas para pedir datos personales. El mensaje pide «actualizar» o «confirmar» la cuenta respondiendo, entrando a un sitio falso o llamando a un número, y así obtiene claves, datos bancarios y números de tarjetas.",x:"Target fue atacado porque un phishing robó las credenciales de un contratista, Fazio Mechanical."},
  spear:{s:1,t:"Spear phishing",h:"Un engaño hecho a la medida de una persona",d:"Phishing dirigido a una persona o grupo concreto. El mensaje parece venir de una fuente de confianza, como un colega dentro de la propia empresa o un amigo, por eso es mucho más convincente que el phishing masivo.",x:"Un correo «de tu jefe» que pide revisar un archivo adjunto es spear phishing."},
  eviltwin:{s:1,t:"Gemelos malvados",h:"Wi-Fi falso con el mismo nombre que el real",d:"Gemelos malvados: redes Wi-Fi falsas que se ven idénticas a una red pública confiable, como la de un aeropuerto, un hotel o una cafetería. Quien se conecta sin darse cuenta entrega sus contraseñas o números de tarjeta a los estafadores.",x:"Es una de las «nuevas tecnologías de phishing», más difíciles de detectar que un correo falso."},
  pharming:{s:1,t:"Pharming",h:"Escribes bien la dirección y aun así te desvían",d:"Redirige al usuario a una página falsa aunque escriba correctamente la dirección en el navegador. Los atacantes entran a los servidores del proveedor de Internet, que tienen fallas, y cambian las direcciones guardadas para acelerar la navegación.",x:"A diferencia del phishing, no necesitas hacer clic en nada sospechoso: el desvío ocurre en el proveedor."},
  clickfraud:{s:1,t:"Fraude del clic",h:"Clics falsos en anuncios para gastar dinero ajeno",d:"Hacer clic de forma fraudulenta en anuncios de pago por clic, sin intención de conocer al anunciante ni comprar. Como el anunciante paga cada clic, el fraude infla sus costos de marketing. Lo hacen personas contratadas o programas, muchas veces botnets.",x:"Algunas empresas pagan a terceros para hacer clic en los anuncios de su competencia y debilitarla."},
  ciberguerra:{s:1,t:"Guerra informática",h:"Un país ataca las redes de otro",d:"Guerra informática: actividad patrocinada por un estado para paralizar y vencer a otro estado penetrando sus computadoras o redes, causando daño y perturbación. Amenaza la infraestructura de un país: finanzas, salud, gobierno e industria dependen de Internet.",x:"Hay 250.000 sondas por hora intentando entrar a las redes del Departamento de Defensa de EE. UU. Ejemplo: Stuxnet."},
  ingsocial:{s:1,t:"Ingeniería social",h:"Engañar a una persona para que dé sus claves",d:"Engañar a los empleados para que revelen sus contraseñas, fingiendo ser miembros legítimos de la empresa que necesitan información. Ataca a la persona, no a la tecnología.",x:"Las contraseñas se pueden robar por la red con un husmeador o simplemente pidiéndolas con ingeniería social."},
  wardriving:{s:1,t:"War driving",h:"Espiar el Wi-Fi desde un auto afuera",d:"Técnica en que espías conducen cerca de un edificio o se estacionan afuera para interceptar el tráfico de su red inalámbrica. Funciona porque las bandas de radio son fáciles de explorar y muchas redes no tienen protección básica.",x:"Con una laptop, una antena y software de piratería, un intruso entra fácilmente a una red 802.11."},
  capas:{s:1,t:"Vulnerabilidad por capas",h:"Hay riesgo en cada capa de la red",d:"En una arquitectura cliente/servidor hay vulnerabilidades en cada capa y entre ellas (Figura 8.1). Cliente: errores y acceso sin autorización. Líneas de comunicación: intervención, sniffing, alteración de mensajes, radiación. Servidores: hacking, malware, vandalismo, negación de servicio. Sistemas corporativos: robo, copia o alteración de datos y fallas de hardware o software.",x:"Además, incendios, inundaciones y cortes de energía pueden interrumpir cualquier punto de la red."},
  internet:{s:1,t:"Redes abiertas",h:"Una red abierta a cualquiera es más riesgosa",d:"Las redes públicas grandes como Internet son más vulnerables que las internas porque están abiertas a casi cualquiera, y son tan grandes que un abuso tiene un impacto enorme. Cuando Internet pasa a ser parte de la red corporativa, la empresa queda expuesta a personas ajenas.",x:"La telefonía por Internet (VoIP) sin cifrar, el correo, la mensajería y el P2P abren más puertas de entrada."},
  wifi:{s:1,t:"Vulnerabilidad inalámbrica",h:"Las ondas Wi-Fi se captan desde afuera",d:"Las redes Wi-Fi y Bluetooth son fáciles de explorar porque sus bandas de radio se captan desde afuera. El SSID que identifica cada punto de acceso se transmite varias veces y los husmeadores lo detectan. Con él, un intruso puede entrar a la red o montar un punto de acceso falso para capturar claves.",x:"Incluso la red Wi-Fi de tu casa es vulnerable si no está protegida."},
  internos:{s:1,t:"Amenazas internas",h:"El riesgo también está adentro: los empleados",d:"Los propios empleados son una gran amenaza: tienen acceso privilegiado y, con procedimientos descuidados, pueden moverse por los sistemas sin dejar rastro. Olvidan o comparten sus contraseñas, caen en ingeniería social e introducen errores al ingresar datos o no seguir instrucciones.",x:"Según estudios, la falta de conocimiento de los usuarios es la principal causa de fugas de seguridad en las redes."},
  bugs:{s:1,t:"Bugs",h:"Errores ocultos en el código",d:"Defectos ocultos en el código de un programa. Su fuente principal es la complejidad del código de decisiones: un programa de cientos de líneas ya tiene miles de rutas posibles. En programas grandes es imposible llegar a cero defectos, y además abren puertas a los intrusos.",x:"Heartbleed, una falla en OpenSSL, dejaba a los hackers leer datos personales y claves de cifrado de dos tercios de los servidores web."},
  parches:{s:1,t:"Parches",h:"Arreglos que publica el fabricante",d:"Pequeñas piezas de software que publica el distribuidor para corregir una falla sin alterar el funcionamiento correcto del programa. Rastrear las vulnerabilidades, probar y aplicar todos los parches es responsabilidad del usuario y se llama administración de parches; es lenta y costosa.",x:"Un parche defectuoso obligó a American Airlines a cancelar o retrasar 1.950 vuelos en 2013."},

  seguridad:{s:2,t:"Seguridad",h:"El escudo contra accesos, robos y daños",d:"Las políticas, procedimientos y medidas técnicas que se usan para evitar el acceso no autorizado, la alteración, el robo o el daño físico a los sistemas de información.",x:"Sin firewall ni antivirus, una computadora conectada a Internet quedaría inutilizada en segundos."},
  controles:{s:2,t:"Controles",h:"Reglas que mantienen todo correcto y registrado",d:"Métodos, políticas y procedimientos organizacionales que garantizan tres cosas: la seguridad de los activos de la organización, la precisión y confiabilidad de sus registros y que las operaciones cumplan los estándares gerenciales.",x:"Seguridad protege; control asegura que todo se haga y se registre correctamente."},
  valorneg:{s:2,t:"Valor de negocios",h:"Sin seguridad, el negocio puede quebrar",d:"La seguridad no genera ventas directas, pero protege activos de información muy valiosos (datos de clientes, finanzas, planes, secretos). Si los sistemas fallan o se filtran, la empresa puede perder ventas y no recuperarse. Un buen marco de seguridad y control rinde mucho sobre la inversión, aumenta la productividad y baja los costos.",x:"Se estima que el 40% de los negocios no se recupera si pierde aplicaciones o datos por más de tres días."},
  responsabilidad:{s:2,t:"Responsabilidad legal",h:"Si filtras datos ajenos, te pueden demandar",d:"La empresa debe proteger no solo sus datos, sino también los de sus clientes, empleados y socios. Si no toma medidas razonables y los datos se filtran, roban o corrompen, puede ser demandada y pagar compensaciones.",x:"BJ's Wholesale Club pagó US$13 millones a los bancos por tarjetas robadas de sus sistemas."},
  hipaa:{s:2,t:"HIPAA",h:"Ley de datos de salud",d:"Tipo de ley que existe en muchos países: los datos médicos de los pacientes exigen protección especial. HIPAA es el ejemplo del libro (EE. UU., 1996): fija reglas de seguridad y privacidad para la información de pacientes, exige conservarla seis años y castiga divulgarla.",x:"Aplica a clínicas, hospitales, aseguradoras de salud y a quien maneje datos de pacientes."},
  glb:{s:2,t:"Ley Gramm-Leach-Bliley",h:"Ley de datos de clientes financieros",d:"Tipo de ley que obliga a bancos y financieras a proteger los datos de sus clientes, tanto guardados como cuando viajan por la red. Gramm-Leach-Bliley es el ejemplo del libro (EE. UU., 1999).",x:"Aplica a bancos, aseguradoras y empresas de servicios financieros."},
  sox:{s:2,t:"Ley Sarbanes-Oxley",h:"Ley de controles financieros",d:"Tipo de ley que hace responsables a las empresas en bolsa de que su información financiera sea precisa, y les exige controles internos que lo demuestren. Sarbanes-Oxley es el ejemplo del libro (EE. UU., 2002), creada tras los fraudes de Enron y WorldCom.",x:"También rige para empresas extranjeras, incluidas latinoamericanas, que transan acciones en EE. UU."},
  rgpd:{s:2,t:"Ley de protección de datos personales",h:"Tus datos personales son tuyos y la ley los protege",d:"Tipo de ley general, no de un solo sector: toda organización que trata datos personales debe pedir consentimiento, usarlos solo para lo declarado, protegerlos y avisar si se filtran. El referente mundial es el RGPD (GDPR) de la Unión Europea, que inspiró leyes en muchos países.",x:"El RGPD multa hasta el 4% de la facturación mundial de la empresa."},
  evidencia:{s:2,t:"Evidencia electrónica",h:"Datos digitales que sirven en un juicio",d:"Datos digitales que se usan como prueba en un juicio: correos, mensajes, archivos y transacciones. Cuando un juez la solicita, la empresa está obligada por ley a entregarla; si los datos están desordenados, dañados o destruidos, responder cuesta caro y puede haber castigos.",x:"Hoy el correo electrónico es el tipo más común de evidencia electrónica."},
  retencion:{s:2,t:"Política de retención",h:"Cuánto tiempo guardar cada documento",d:"Política que asegura que los documentos electrónicos, correos y registros estén bien organizados y accesibles, y que no se guarden demasiado tiempo ni se descarten demasiado pronto. También preserva la evidencia que podría necesitar un análisis forense.",x:"Los tribunales castigan la destrucción inapropiada de documentos electrónicos."},
  forense:{s:2,t:"Análisis forense de sistemas",h:"Rescatar y analizar datos para un juicio",d:"Análisis forense de sistemas: recolectar, examinar, autenticar, preservar y analizar científicamente datos de medios de almacenamiento para usarlos como evidencia en un juzgado. Recupera datos sin dañar su valor de prueba, los guarda con seguridad, encuentra lo importante entre muchos datos y lo presenta al tribunal.",x:"La empresa debería incluirlo en su plan de contingencia, junto al CIO, seguridad y asesores legales."},
  ambientales:{s:2,t:"Datos ambientales",h:"Datos ocultos, como archivos borrados",d:"Datos que el usuario promedio no ve, pero que siguen en el medio de almacenamiento. Un experto forense puede recuperarlos y presentarlos como evidencia.",x:"Un archivo que borraste del disco duro sigue ahí como dato ambiental hasta que se sobrescribe."},

  cgenerales:{s:3,t:"Controles generales",h:"Controles para toda la infraestructura",d:"Controles que gobiernan el diseño, la seguridad y el uso de los programas y archivos de datos en toda la infraestructura de TI. Se aplican a todas las aplicaciones a la vez y combinan hardware, software y procedimientos manuales. Son seis: de software, de hardware, de operaciones, de seguridad de datos, de implementación y administrativos.",x:"Si protege a todos los sistemas de la empresa, es un control general."},
  capp:{s:3,t:"Controles de aplicación",h:"Controles de una sola aplicación",d:"Controles específicos de cada aplicación, como la nómina o el procesamiento de pedidos. Combinan procedimientos automáticos y manuales para que la aplicación procese de forma completa y precisa solo los datos autorizados. Son de tres tipos: de entrada, de procesamiento y de salida.",x:"Si solo protege a un programa en particular, es un control de aplicación."},
  c_soft:{s:3,t:"Controles de software",h:"Protegen los programas del sistema",d:"Control general que monitorea el uso del software de sistemas y evita el acceso no autorizado a los programas de software, al software de sistemas y a los programas de computadora.",x:"Que solo personal autorizado pueda modificar el sistema operativo del servidor."},
  c_hard:{s:3,t:"Controles de hardware",h:"Protegen el equipo físico",d:"Control general que asegura que el hardware sea físicamente seguro y verifica las fallas del equipo. Las empresas que dependen mucho de sus computadoras también deben prever respaldos u operación continua para mantener el servicio.",x:"Sala de servidores con llave y equipos de respaldo listos."},
  c_ops:{s:3,t:"Controles de operaciones",h:"Vigilan que el procesamiento salga bien",d:"Control general que supervisa el trabajo del departamento de cómputo para que los procedimientos programados se apliquen de forma consistente y correcta al almacenar y procesar datos. Incluye controles sobre los trabajos de procesamiento y procedimientos de respaldo y recuperación si un proceso termina de forma anormal.",x:"El proceso nocturno falla y se recupera desde el último respaldo."},
  c_datos:{s:3,t:"Controles de seguridad de datos",h:"Protegen los archivos de datos",d:"Control general que asegura que los archivos de datos valiosos del negocio, en disco o cinta, no sean accedidos, modificados ni destruidos sin autorización, ni mientras se usan ni mientras están almacenados.",x:"El archivo de clientes solo se puede cambiar con permiso."},
  c_impl:{s:3,t:"Controles de implementación",h:"Revisan el desarrollo de sistemas",d:"Control general que audita el proceso de desarrollo de sistemas en varios puntos, para asegurar que se controle y administre de manera apropiada.",x:"Revisar el proyecto en cada etapa antes de poner el sistema en producción."},
  c_admin:{s:3,t:"Controles administrativos",h:"Normas que hacen cumplir los controles",d:"Control general que formaliza estándares, reglas, procedimientos y disciplinas de control para que los controles generales y de aplicación se ejecuten e implementen correctamente.",x:"Un manual de procedimientos que todos deben seguir y que se supervisa."},
  c_entrada:{s:3,t:"Controles de entrada",h:"Revisan los datos al entrar",d:"Control de aplicación que verifica la precisión e integridad de los datos cuando entran al sistema. Incluye autorización de la entrada, conversión de datos, edición de datos (rechazar valores imposibles) y manejo de errores.",x:"El sistema de pedidos rechaza un pedido sin número de cliente o con una fecha imposible."},
  c_proc:{s:3,t:"Controles de procesamiento",h:"Revisan los datos al actualizarse",d:"Control de aplicación que establece que los datos sigan completos y precisos durante la actualización, cuando el sistema los procesa.",x:"Comparar los totales antes y después de actualizar el archivo maestro para confirmar que no se perdió ningún registro."},
  c_salida:{s:3,t:"Controles de salida",h:"Revisan los resultados y a quién llegan",d:"Control de aplicación que asegura que los resultados del procesamiento sean precisos y completos, y que se distribuyan solo a quien corresponde.",x:"Revisar que el reporte final esté completo y entregar la nómina solo a las personas autorizadas."},
  riesgo:{s:3,t:"Evaluación del riesgo",h:"Probabilidad × pérdida: decide qué proteger",d:"Determina el nivel de riesgo para la empresa si una actividad o proceso no se controla bien: qué activos hay que proteger y qué tan vulnerables son. Se estima la probabilidad de cada problema y su pérdida promedio; pérdida anual esperada = probabilidad × pérdida promedio. Los controles se enfocan donde esa pérdida es mayor.",x:"Falla eléctrica: 30% × US$102.500 = US$30.750 al año. No conviene gastar US$20.000 para evitar una pérdida de US$1.000."},
  politica:{s:3,t:"Política de seguridad",h:"Decide qué riesgos se aceptan",d:"Conjunto de enunciados que clasifican los riesgos de información, fijan qué nivel de riesgo es aceptable y definen los mecanismos para lograr esos objetivos. Responde: qué activos son los más importantes, quién los controla y cuánto riesgo acepta la gerencia. Incluye la política de uso aceptable y la administración de identidad.",x:"¿Aceptamos perder los datos de tarjetas una vez cada 10 años, o diseñamos para un desastre cada 100?"},
  aup:{s:3,t:"Política de uso aceptable (AUP)",h:"Qué puedes y qué no con el equipo de la empresa",d:"Política de uso aceptable: define los usos permitidos de los recursos de información y del equipo de la empresa (computadores, dispositivos inalámbricos, teléfonos, Internet). Aclara la privacidad, la responsabilidad del usuario y el uso personal, y fija las consecuencias de no cumplirla.",x:"Unilever exige que cada empleado use un dispositivo de la empresa y una contraseña para entrar a la red."},
  identidadadm:{s:3,t:"Administración de identidad",h:"Quién puede ver y cambiar qué",d:"Procesos de negocio y herramientas de software para identificar a los usuarios válidos de un sistema y controlar su acceso. Define categorías de usuarios, a qué sistemas o datos puede entrar cada uno según su perfil, y cómo se autentican y protegen sus identidades.",x:"En recursos humanos, un oficinista ingresa datos pero no ve salarios; el gerente ve todo pero no modifica."},
  auditoria:{s:3,t:"Auditoría de sistemas",h:"Revisa los controles y reporta las fallas",d:"Examina el entorno de seguridad de la empresa y los controles de cada sistema. El auditor rastrea transacciones de ejemplo, hace pruebas y puede simular un ataque o desastre. Luego lista y clasifica las debilidades de control, estima su probabilidad e impacto y las informa a la gerencia, que debe responder con un plan.",x:"Ejemplo del libro: «contraseñas faltantes en cuentas de usuario» en el sistema de préstamos de un banco."},
  drp:{s:3,t:"Recuperación de desastres",h:"Que vuelvan a funcionar los sistemas",d:"Planificación de recuperación de desastres: planes para restaurar los servicios de cómputo y comunicaciones después de una interrupción. Se enfoca en lo técnico: qué archivos respaldar y cómo mantener sistemas o sitios de cómputo de respaldo.",x:"MasterCard tiene un centro de cómputo duplicado en Kansas City como respaldo del de St. Louis."},
  bcp:{s:3,t:"Continuidad de negocios",h:"Que el negocio siga funcionando",d:"Planificación de continuidad de negocios: cómo la empresa restaura sus operaciones de negocio después de un desastre. Identifica los procesos de negocio críticos y fija planes de acción para las funciones de misión crítica si fallan los sistemas. Se coordina con la recuperación de desastres.",x:"Deutsche Bank mantiene equipos en cinco países que coordinan cómo seguir operando ante una catástrofe."},
  impacto:{s:3,t:"Análisis de impacto comercial",h:"Qué sistemas importan más y cuánto aguantamos sin ellos",d:"Análisis de impacto comercial: identifica los sistemas más críticos de la empresa y el efecto que tendría su falla. Con él la gerencia determina cuánto tiempo puede sobrevivir la empresa con los sistemas caídos y qué partes restaurar primero. Es la base de los planes de continuidad y recuperación.",x:"Si la tienda en línea no aguanta más de dos horas caída, ese sistema se recupera primero."},

  autenticacion:{s:4,t:"Autenticación",h:"Probar que eres quien dices ser",d:"La capacidad de saber que una persona es quien dice ser. Para entrar a un sistema, el usuario debe estar autorizado y autenticado. Se hace con algo que sabes (contraseña), algo que tienes (token, tarjeta inteligente) o algo que eres (biometría).",x:"La forma más común, y la más débil, es la contraseña."},
  contrasena:{s:4,t:"Contraseña",h:"Lo más común y lo más frágil",d:"La forma más común de autenticación: una clave que solo conoce el usuario autorizado. Falla porque la gente la olvida, la comparte o elige una fácil de adivinar; si las reglas son muy estrictas, la anotan a la vista. También se puede husmear en la red o robar con ingeniería social.",x:"Un papel con la clave pegado al monitor anula toda la seguridad."},
  token:{s:4,t:"Token",h:"Un llavero con códigos que cambian",d:"Dispositivo físico, del tamaño de un llavero, diseñado para demostrar la identidad de un solo usuario. Muestra códigos de acceso que cambian con frecuencia, así que una clave robada deja de servir en poco tiempo.",x:"Para entrar a la red escribes el código de seis dígitos que muestra el llavero en ese momento."},
  smartcard:{s:4,t:"Tarjeta inteligente",h:"Tarjeta con chip de acceso",d:"Tarjeta del tamaño de una tarjeta de crédito con un chip que guarda permisos de acceso y otros datos. Un lector interpreta el chip y permite o niega el acceso. También se usa en sistemas de pago.",x:"Las tarjetas EMV de chip y PIN generan un valor cifrado distinto en cada compra; la tira magnética repite siempre el mismo."},
  biometria:{s:4,t:"Autenticación biométrica",h:"Tu huella, cara o voz como llave",d:"Autenticación que lee rasgos humanos únicos, físicos o de comportamiento, como huellas, iris, rostro o voz, y los compara con un perfil almacenado. Si coinciden, se otorga el acceso.",x:"Laptops y teléfonos con lector de huellas o reconocimiento facial."},
  dosfactores:{s:4,t:"Autenticación de dos factores",h:"Algo que tienes + algo que sabes",d:"Autenticación que valida al usuario en un proceso de varias etapas: debe presentar dos medios distintos. Normalmente uno es algo físico (tarjeta inteligente, tarjeta bancaria con chip) y el otro es algo que sabe (contraseña o PIN); la biometría también puede ser uno de ellos.",x:"La tarjeta del banco (lo que tienes) más el PIN (lo que sabes)."},
  firewall:{s:4,t:"Firewall",h:"El muro que filtra lo que entra y sale",d:"Combinación de hardware y software que controla el tráfico que entra y sale de una red. Se ubica entre la red privada y redes no confiables como Internet (o entre partes de la red interna). Como un portero, revisa nombres, direcciones IP y aplicaciones y los compara con las reglas del administrador.",x:"Usa filtrado de paquetes, inspección con estado, NAT y proxy de aplicación. Ayuda, pero no impide todo: es una pieza del plan."},
  paquetes:{s:4,t:"Filtrado de paquetes",h:"Revisa cada paquete por separado",d:"Filtrado de paquetes estático: el firewall examina ciertos campos en el encabezado de cada paquete que entra o sale, revisando cada paquete aislado. Es la técnica más simple y puede pasar por alto muchos tipos de ataques.",x:"Un paquete malicioso con encabezado normal pasa sin problemas."},
  estado:{s:4,t:"Inspección con estado",h:"Recuerda la conversación completa",d:"Inspección con estado: el firewall lleva tablas de estado para saber si cada paquete forma parte de una conversación legítima entre un emisor y un receptor. Acepta o rechaza paquetes según si pertenecen a una conversación aprobada o intentan establecer una conexión legítima.",x:"Rechaza un paquete que dice responder a una conexión que nadie de adentro abrió."},
  nat:{s:4,t:"NAT",h:"Esconde las direcciones internas",d:"Traducción de direcciones de red: oculta las direcciones IP de las computadoras internas, para que los husmeadores fuera del firewall no puedan descubrirlas y usarlas para entrar. Agrega una capa de protección al filtrado de paquetes y a la inspección con estado.",x:"Desde afuera, toda la oficina parece una sola dirección."},
  proxy:{s:4,t:"Filtrado de proxy de aplicación",h:"Un intermediario que revisa el contenido",d:"Filtrado de proxy de aplicación: examina el contenido de los paquetes. Un servidor proxy detiene los datos que llegan, los inspecciona y se comunica con el otro lado en nombre del usuario: nadie de afuera habla directamente con una computadora interna, ni al revés.",x:"Es la técnica de firewall que revisa qué dice el mensaje, no solo su encabezado."},
  ids:{s:4,t:"Detección de intrusos (IDS)",h:"El radar que vigila y da la alarma",d:"Sistema de detección de intrusos: herramientas de monitoreo continuo ubicadas en los puntos más vulnerables de la red. Buscan patrones de ataques conocidos, revisan que no se borren o modifiquen archivos importantes y generan una alarma ante eventos sospechosos; incluso pueden desconectar una parte delicada de la red.",x:"FireEye detectó el malware en Target y dio la alarma, pero nadie actuó."},
  antivirus:{s:4,t:"Software antivirus",h:"Atrapa el malware que ya conoce",d:"Software que previene, detecta y elimina malware: virus, gusanos, troyanos, spyware y adware. Su límite: casi solo detecta el malware que ya se conocía al escribirlo, por eso hay que actualizarlo siempre y complementarlo con otras herramientas.",x:"Según Solutionary, el 54% del malware evade a los antivirus."},
  utm:{s:4,t:"Administración unificada de amenazas (UTM)",h:"Todas las defensas en un solo paquete",d:"Administración unificada de amenazas: un solo producto que combina firewall, red privada virtual (VPN), detección de intrusos, filtrado de contenido web y antispam. Reduce costos y simplifica la administración; nació para pymes y hoy existe para redes de todo tamaño.",x:"Proveedores: Fortinet, Check Point, Blue Coat."},
  wep:{s:4,t:"WEP",h:"Wi-Fi viejo con clave fija: inseguro",d:"Privacidad equivalente a cableado: el primer estándar de seguridad Wi-Fi. Sus claves de cifrado son estáticas y relativamente fáciles de descifrar. Da algo de protección solo si se activa, y mejora si se combina con una VPN.",x:"Fue reemplazado por WPA2 en 2004."},
  wpa2:{s:4,t:"WPA2",h:"Wi-Fi con claves que cambian todo el tiempo",d:"Acceso Wi-Fi protegido 2 (802.11i), que reemplazó a WEP en 2004. Usa claves de cifrado mucho más largas que cambian continuamente, y autentica a los usuarios con un servidor central para que solo los autorizados entren a la red.",x:"Si la clave cambia todo el tiempo, robar una deja de servir."},
  cifrado:{s:4,t:"Cifrado",h:"Convierte el mensaje en algo ilegible",d:"Transformar texto o datos simples en texto cifrado que nadie puede leer salvo el emisor y el receptor deseado. Se hace con un código numérico secreto llamado clave de cifrado; el receptor debe descifrar el mensaje. Protege datos almacenados, transportados o enviados por Internet.",x:"Los dos métodos de cifrado son de clave simétrica y de clave pública."},
  ssl:{s:4,t:"SSL / TLS",h:"Un túnel cifrado para toda la sesión",d:"Capa de sockets seguros (SSL) y su sucesor, seguridad de la capa de transporte (TLS): establecen una conexión segura entre dos computadoras. Navegador y servidor negocian la clave y el nivel de seguridad, y desde ahí cifran todos los mensajes de esa sesión web.",x:"Es lo que protege la sesión cuando pagas en una tienda en línea."},
  shttp:{s:4,t:"S-HTTP",h:"Cifra cada mensaje por separado",d:"Protocolo de transferencia de hipertexto seguro: cifra los datos que viajan por Internet, pero mensaje por mensaje. A diferencia de SSL/TLS, no establece una sesión segura entre las dos computadoras.",x:"S-HTTP cifra cada mensaje; SSL cifra toda la conversación."},
  simetrica:{s:4,t:"Clave simétrica",h:"La misma llave en ambos lados",d:"Cifrado en que emisor y receptor usan la misma clave: el emisor la crea y se la envía al receptor. Su fuerza se mide en bits (hoy es común 128). Su problema: la clave hay que compartirla, y en el camino alguien puede interceptarla.",x:"Una sola llave para cerrar y abrir: si te la roban en el envío, todo queda expuesto."},
  publica:{s:4,t:"Clave pública",h:"Cierra con la pública; abre solo la privada",d:"Cifrado que usa dos claves relacionadas matemáticamente: una pública, guardada en un directorio, y otra privada y secreta. Lo cifrado con una solo se descifra con la otra. El emisor cifra con la clave pública del receptor y solo la clave privada del receptor lo descifra.",x:"Cualquiera puede cerrar el candado (clave pública), pero solo el dueño tiene la llave que lo abre (clave privada)."},
  certificado:{s:4,t:"Certificado digital",h:"Tu identificación digital",d:"Archivo de datos que establece la identidad de usuarios y activos electrónicos para proteger las transacciones en línea. Lo emite una autoridad de certificación y contiene datos del dueño y una copia de su clave pública, certificando que esa clave le pertenece.",x:"Antes de pagar, el cliente y la tienda verifican que sus certificados vengan de una autoridad confiable."},
  ca:{s:4,t:"Autoridad de certificación (CA)",h:"Quien emite y respalda los certificados",d:"Autoridad de certificación: tercero de confianza que verifica, fuera de Internet, la identidad de un usuario y le emite un certificado digital cifrado. Su propia clave es pública, así cualquiera puede comprobar que un certificado lo emitió ella.",x:"Ejemplos: Symantec, GoDaddy y Comodo."},
  pki:{s:4,t:"Infraestructura de clave pública (PKI)",h:"Clave pública + autoridad de certificación",d:"Infraestructura de clave pública: el uso de la criptografía de clave pública junto con una autoridad de certificación. Es lo que hoy se usa ampliamente en el comercio electrónico.",x:"PKI = clave pública + certificados de una CA."},
  oltp:{s:4,t:"Procesamiento de transacciones en línea",h:"Cada transacción se procesa al instante",d:"Procesamiento de transacciones en línea: la computadora procesa de inmediato cada transacción, con cambios a bases de datos, informes y consultas a cada instante. Por eso empresas como bancos y aerolíneas necesitan sistemas disponibles el 100% del tiempo.",x:"Cada compra en el CyberDay descuenta el stock en ese mismo momento."},
  altadisp:{s:4,t:"Alta disponibilidad",h:"Si se cae, vuelve rápido",d:"Diseño de sistemas para recuperarse rápido de una falla, con servidores de respaldo, balanceo de carga y almacenamiento redundante, de modo que el servicio vuelva en poco tiempo. A diferencia de la tolerancia a fallas, puede haber una breve interrupción.",x:"Si un servidor de la tienda cae, otro toma su carga en minutos."},
  tolerante:{s:4,t:"Tolerancia a fallas",h:"Si algo falla, el respaldo entra solo",d:"Sistemas con componentes redundantes de hardware, software y suministro de energía que dan un servicio continuo, sin interrupciones. Usan rutinas o circuitos de autocomprobación para detectar fallas y cambiar solos a un respaldo; las piezas se reparan sin apagar el sistema.",x:"Bancos y aerolíneas los usan para lograr 100% de disponibilidad."},
  inactivo:{s:4,t:"Tiempo inactivo",h:"El tiempo en que el sistema está caído",d:"Los periodos en que un sistema no está funcionando. Para un negocio que depende de sus sistemas, cada minuto inactivo son ventas y operaciones perdidas; por eso se invierte en tolerancia a fallas y alta disponibilidad.",x:"Amazon y Salesforce han tenido caídas en la nube que interrumpieron a millones de usuarios."},
  dpi:{s:4,t:"Inspección profunda de paquetes (DPI)",h:"Da prioridad al tráfico importante",d:"Inspección profunda de paquetes: examina los archivos de datos y les asigna prioridad según las reglas del operador de la red. Decide si un paquete sigue, se retrasa o se bloquea, para que el tráfico crítico para la empresa avance antes que el de baja prioridad.",x:"La universidad Ball State bajó la prioridad de las descargas P2P de sus estudiantes y su red volvió a ser rápida."},
  mssp:{s:4,t:"MSSP",h:"Seguridad subcontratada a expertos",d:"Proveedores de servicios de seguridad administrados: empresas a las que se subcontrata la seguridad. Monitorean la actividad de la red y hacen pruebas de vulnerabilidad y detección de intrusos. Útiles para empresas, sobre todo pequeñas, que no tienen recursos ni expertos propios.",x:"Ejemplos: SecureWorks, BT Managed Security Solutions y Symantec."},
  nube:{s:4,t:"Seguridad en la nube",h:"En la nube, tus datos siguen siendo tu responsabilidad",d:"En la nube, la responsabilidad de proteger los datos sigue siendo de la empresa dueña. Los datos pueden estar en centros de datos de cualquier país, junto a los de otras empresas. Hay que exigir cifrado, jurisdicción conocida, separación de datos, recuperación ante desastres y auditorías, y dejarlo escrito en el acuerdo de nivel de servicio (SLA).",x:"Tal vez no sepas dónde están tus datos: por eso los controles van en el contrato."},
  movil:{s:4,t:"Seguridad móvil",h:"Bloquear o borrar el teléfono a distancia",d:"Los dispositivos móviles necesitan la misma protección que un computador contra malware, robo, pérdida y hackers. La empresa debe incluirlos en su política, autorizar y registrar cada dispositivo, cifrar las comunicaciones, exigir contraseña y poder bloquear o borrar a distancia un equipo perdido o robado.",x:"El 72% de las empresas dice que su mayor preocupación móvil es el robo o la pérdida del equipo."},
  byod:{s:4,t:"BYOD",h:"Trabajar con tu propio teléfono",d:"Traiga su propio dispositivo: los empleados usan su teléfono o tablet personal para trabajar. Aumenta la productividad y disponibilidad, pero expone datos corporativos si el equipo se pierde, se infecta con apps maliciosas o se usan servicios de nube inseguros.",x:"Casi la mitad de las empresas que permiten BYOD ha sufrido una fuga de datos."},
  metrica:{s:4,t:"Métrica de software",h:"Medir el software con números",d:"Evaluación de los objetivos del sistema en forma de medidas cuantificadas. Usada de manera continua, permite medir el desempeño del sistema y detectar problemas a medida que ocurren. Debe ser formal, objetiva y usarse siempre igual.",x:"Transacciones por segundo, tiempo de respuesta, cheques de nómina por hora, errores por cada cien líneas de código."},
  recorrido:{s:4,t:"Recorrido",h:"Revisar el diseño antes de programar",d:"Revisión de una especificación o documento de diseño hecha por un grupo pequeño de personas elegidas por sus habilidades. Inicia el proceso de prueba antes de escribir el programa; después también se hacen recorridos del código.",x:"Una buena prueba empieza antes de programar: revisando el diseño."},
  depuracion:{s:4,t:"Depuración",h:"Encontrar el error y eliminarlo",d:"El proceso de encontrar el origen de un error descubierto al probar el programa y eliminarlo. Para probar el código hay que ejecutarlo; cuando aparece un error, la depuración lo localiza y lo corrige.",x:"Todo software grande tiene errores: se prueba para descubrirlos y se depura para eliminarlos."}
};

 { name:"Valor", short:"Valor", take:["Una empresa que depende de sus sistemas puede perder ventas o dejar de operar si fallan, y la pueden demandar si filtra datos de sus clientes.", "Las leyes obligan a proteger los datos: HIPAA (salud), Gramm-Leach-Bliley (instituciones financieras) y Sarbanes-Oxley (finanzas de empresas en bolsa).", "Hay que poder entregar evidencia electrónica: política de retención y análisis forense.", "Un buen marco de seguridad y control rinde: sube la productividad y baja los costos."], case:"Sección 2 · Valor", intro:"Una empresa hackeada enfrenta demandas millonarias. Demuestra cuánto vale la seguridad.", q:"¿Cuál es el valor de negocios de la seguridad y el control?", rounds:[

  { name:"Evaluación del riesgo", m:"El presupuesto es poco. Decide dónde invertir.", brief:["riesgo"], phases:[
    { type:"mcq", tag:"Pedidos en línea", lead:"Piensa como auditor: pérdida anual esperada = probabilidad × pérdida promedio. Las cuentas ya están hechas: decide tú.",
      items:[
      {q:"¿Cómo se obtiene la pérdida anual esperada de un riesgo?",o:["Probabilidad × pérdida promedio","Probabilidad + pérdida promedio","Pérdida máxima × 12 meses","Solo la pérdida máxima"],a:"Probabilidad × pérdida promedio",c:"riesgo",w:"La pérdida anual esperada combina qué tan probable es el evento y cuánto cuesta en promedio cuando ocurre. Por ejemplo, 30% × $102.500 = $30.750 al año."},
      {q:"Una malversación cuesta entre $1.000 y $50.000 cada vez. ¿Qué valor se usa como pérdida promedio?",o:["El punto medio del rango","El valor más alto","El valor más bajo","La suma de ambos extremos"],a:"El punto medio del rango",c:"riesgo",w:"Laudon usa el punto medio del rango como pérdida promedio: ($1.000 + $50.000) ÷ 2 = $25.500."},
      {q:"Errores de usuarios: $19.698 al año. Malversación: $1.275 al año. ¿Dónde conviene poner más controles?",o:["En los errores de usuarios","En la malversación","En ambos por igual","En ninguno"],a:"En los errores de usuarios",c:"riesgo",w:"Los controles van donde la pérdida anual esperada es mayor: $19.698 contra $1.275. Esa cifra ya incluye qué tan probable es cada riesgo. La malversación cuesta más cada vez que ocurre, pero ocurre tan pocas veces que al año pesa mucho menos."},
      {q:"Un evento ocurre a lo más una vez al año y cuesta como máximo $1.000. ¿Conviene un control de $20.000?",o:["No: cuesta más de lo que protege","Sí: todo riesgo debe controlarse","Solo si lo pide la auditoría","Solo si es una amenaza interna"],a:"No: cuesta más de lo que protege",c:"riesgo",w:"La evaluación del riesgo busca el conjunto de controles más eficiente: no se gastan $20.000 para evitar una pérdida de $1.000."}
    ]},
    { type:"seq", lead:"¿Dónde enfocar los controles?", seqs:[{title:"Ordena dónde invertir primero en controles: de mayor a menor pérdida anual esperada.",steps:["Falla de energía · 30% × $102.500 = $30.750 al año","Errores de usuarios · 98% × $20.100 = $19.698 al año","Malversación · 5% × $25.500 = $1.275 al año"],c:"riesgo",w:"Los controles deben enfocarse primero en la energía y en los errores de usuarios. La malversación cuesta más por evento que un error, pero es poco probable."}]}
  ]},
  { name:"Política e identidad", m:"Escribe las reglas del juego.", brief:["politica","aup",{vs:["politica","aup"],d:"La política de seguridad decide qué riesgos son aceptables y cómo enfrentarlos. La AUP la baja a reglas concretas: qué puedes hacer con el equipo de la empresa."},"identidadadm","auditoria"], phases:[

const LB = { db: null, user: null, uid: null, rows: [], state: "loading", readonly: false, tab: "week", sig: "" };
let pushing = false, pushAgain = false;
async function initSocial() {
  if (!(window.claude && typeof window.claude.use === "function")) { LB.state = "off"; return; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { LB.state = "off"; refreshSocial(); return; }
    LB.db = db; LB.user = user; LB.uid = await user.id();
    if (!LB.uid) { LB.state = "off"; refreshSocial(); return; }
    if ((await user.can("data.write")) === false) LB.readonly = true;
    LB.state = "on";
    if (!LB.readonly) await pullSave();
    db.collection("scores").limit(500).onSnapshot(snap => { LB.rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); refreshSocial(); }, () => { LB.state = "off"; refreshSocial(); });
    pushScore(); pushStats();
    /* owners and editors get the teacher panel; the db rules let only them read stats/ */
    let teacher = false;
    try { teacher = await user.canEdit(); } catch (e) {}
    if (teacher && !SOLO) {
      LB.teacher = true; $("#tb-teach").hidden = false;
      db.collection("stats").limit(1000).onSnapshot(snap => { TC.rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); TC.state = "on"; if (screen === "s-teach") renderTeach(); }, () => { TC.state = "off"; if (screen === "s-teach") renderTeach(); });
    }

}
/* progress is also kept in the student's private folder (data/users/<id>), so it follows them to another device; the copy with more XP wins */
let syncT = 0, syncing = false, syncAgain = false;
const saveRef = () => LB.db.collection("data/users/" + LB.uid).doc("brecha" + (SLOT ? SLOT + 1 : ""));
function syncSave() { if (LB.state !== "on" || LB.readonly || !LB.db) return; clearTimeout(syncT); syncT = setTimeout(pushSave, 1500); }
async function pushSave() {
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try { await saveRef().set(JSON.parse(JSON.stringify(save))); }
  catch (e) { if (e && (e.code === "not_granted" || e.code === "revoked")) LB.readonly = true; }
  syncing = false;
  if (syncAgain) { syncAgain = false; pushSave(); }
}
async function pullSave() {
  try {
    const snap = await saveRef().get(), d = snap.exists ? snap.data() : null;
    /* only the same game (same birth stamp) is restored: a deleted or new game never brings back an old copy */
    if (d && d.v === 3 && d.born === save.born && (+d.xp || 0) > save.xp) {
      save = loadSave(JSON.parse(JSON.stringify(d))); store.set(slotKey(SLOT), save);
      applySkin();
      if (screen === "s-title") renderTitle(); else if (TABS.includes(screen)) openTab(screen);
    } else if (save.xp) syncSave();
  } catch (e) {}
}
/* what each student struggles with (stats/<id>): readable by the teacher, never by classmates */
let statPushing = false, statAgain = false, statSig = "";
async function pushStats() {
  if (SOLO || LB.state !== "on" || LB.readonly || LB.statsOff || !LB.db || !LB.uid) return;
  const pick = o => Object.fromEntries(Object.entries(o).filter(([id, n]) => C[id] && n > 0));
  const body = { miss: pick(save.missAll), open: pick(save.wrong), missions: Object.keys(save.missions).length, cards: Object.keys(save.concepts).filter(id => C[id]).length, xp: save.xp, stars: totalStars(), beast: save.mode === "beast" };
  if (!body.missions && !Object.keys(body.miss).length) return;
  const sig = JSON.stringify(body); if (sig === statSig) return;
  if (statPushing) { statAgain = true; return; }
  statPushing = true;
  try { await LB.db.collection("stats").doc(LB.uid).set(Object.assign(body, { t: Date.now() })); statSig = sig; }
  catch (e) { if (e && (e.code === "not_granted" || e.code === "revoked" || e.code === "invalid_argument")) LB.statsOff = true; }
  statPushing = false;
  if (statAgain) { statAgain = false; pushStats(); }
}

        <span class="flash-f flash-back">${top}<b class="flash-name sm">${C[id].t}</b><span class="flash-hook">${C[id].h}</span><span class="flash-def">${C[id].d}</span>${C[id].x ? `<span class="flash-def flash-ex">Ejemplo: ${C[id].x}</span>` : ""}<span class="flash-case">${esc(sec.case)}</span></span>

  </div>`;
  const f = $("#flash");

  if (!reduce) {
    f.onpointermove = e => { if (e.pointerType !== "mouse") return; const b = f.getBoundingClientRect(), px = (e.clientX - b.left) / b.width - .5, py = (e.clientY - b.top) / b.height - .5; f.style.setProperty("--ry", (px * 14).toFixed(1) + "deg"); f.style.setProperty("--rx", (-py * 14).toFixed(1) + "deg"); f.style.setProperty("--mx", (px * 70).toFixed(0) + "%"); };

}
function flipFlash() { const f = $("#flash"); if (!f) return; FV.flipped = !FV.flipped; f.classList.toggle("up", FV.flipped); const hn = $("#fv-hint"); if (hn) hn.textContent = FV.flipped ? "Toca la carta para ver el frente" : "Toca la carta para voltearla"; A.whoosh(); }

(() => {

$("#sector").addEventListener("click", e => {

  $("#b-conf-no").onclick = e => { e.stopPropagation(); repClose(); };

    if (e.clientX < r.left + r.width * .3) storyPrev(); else storyNext();
  };
  stage.addEventListener("pointerup", spEnd); stage.addEventListener("pointercancel", spEnd);
  $("#p-pause").onclick = () => pause(true);

  $("#pa-go").onclick = () => pause(false);

  $("#prof").addEventListener("toggle", e => { const d = e.target; if (!d.classList || !(d.classList.contains("pf-sec") || d.classList.contains("pf-more"))) return; d.open ? PF_OPEN.add(d.dataset.sec) : PF_OPEN.delete(d.dataset.sec); const b = $("#pf-all"); if (b) b.textContent = $$("#prof .pf-sec:not(.pf-set)").every(x => x.open) ? "Contraer todo" : "Expandir todo"; }, true);
  $("#prof").addEventListener("change", e => { if (e.target.id !== "pf-name") return; save.name = e.target.value.trim().replace(/\s+/g, " ").slice(0, 12); persist(); A.heal(); });
  $("#prof").addEventListener("input", e => { if (e.target.id === "pf-name") e.target.style.width = nameW(e.target.value || e.target.placeholder); });

  addEventListener("resize", () => { if (R && R.fit) R.fit(); });
